<title>Yerin Altı</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: one-screen mobile game. HUD on top, dig shaft canvas in the middle, control panel below
   (side by side on wide screens). Deliberately single dark "underground" theme. */
:root{
  --bg:#160e09;
  --surface:#22160e;
  --surface-2:#2e1f15;
  --line:#47321f;
  --text:#f7ead8;
  --muted:#b89f86;
  --gold:#ffbf3a;
  --gold-deep:#d9881a;
  --gold-ink:#3a2306;
  --crystal:#b48cff;
  --good:#86d47f;
  --danger:#ff7361;
  --ink:#24150c;
  --display:"Lilita One","Trebuchet MS","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-weight:700;overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{box-sizing:border-box;height:100%;max-width:1120px;margin:0 auto;display:grid;
  grid-template-rows:auto minmax(0,1fr) minmax(0,45%);gap:10px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:880px){
  #app{grid-template-columns:minmax(0,1fr) 420px;grid-template-rows:auto minmax(0,1fr);gap:14px;padding-block:14px}
  .hud{grid-column:1 / -1}
}

/* HUD */
.hud{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) auto;gap:10px;align-items:stretch}
.res{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:8px 12px;min-width:0;display:flex;gap:10px;align-items:center}
.res .big{font-family:var(--display);font-size:1.55rem;line-height:1;letter-spacing:.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.res .sub{font-size:.78rem;color:var(--muted);margin-top:3px;white-space:nowrap;font-variant-numeric:tabular-nums}
.gold-res .big{color:var(--gold)}
.gold-res .sub b{color:var(--text)}
.depth-res{flex-direction:column;align-items:stretch;gap:4px}
.depth-res .row{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.lbl{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bar{height:6px;border-radius:6px;background:#0f0905;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-deep),var(--gold));border-radius:6px;transition:width .3s}
.side{display:flex;flex-direction:column;gap:6px}
.crys{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:4px 10px;display:flex;align-items:center;gap:6px;font-family:var(--display);font-size:1.1rem;color:var(--crystal);font-variant-numeric:tabular-nums}
.hud-btns{display:flex;gap:6px}
.icon-btn{width:36px;height:32px;border-radius:10px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:var(--text);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:active{transform:translateY(1px)}

.coin{display:inline-block;width:30px;height:30px;flex:none;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff3b8 0 12%,var(--gold) 34%,var(--gold-deep) 78%);
  box-shadow:inset 0 0 0 2px rgba(58,35,6,.55),inset 0 -3px 0 rgba(58,35,6,.25)}
.coin.sm{width:14px;height:14px;box-shadow:inset 0 0 0 1.5px rgba(58,35,6,.6)}
.gem{display:inline-block;width:14px;height:16px;flex:none;background:linear-gradient(160deg,#efe4ff,var(--crystal) 45%,#6a3fd6);
  clip-path:polygon(50% 0,100% 35%,50% 100%,0 35%)}
.gem.lg{width:18px;height:20px}

/* Stage */
.stage{position:relative;border-radius:20px;overflow:hidden;border:2px solid var(--line);background:#0c0704;min-height:0;touch-action:none}
#cv{display:block;width:100%;height:100%;touch-action:none;cursor:pointer}
.boost{position:absolute;right:10px;top:10px;border:2px solid var(--gold-ink);border-radius:14px;
  background:linear-gradient(180deg,#ffd36b,var(--gold) 60%,var(--gold-deep));color:var(--gold-ink);
  padding:6px 10px 7px;box-shadow:0 3px 0 var(--gold-ink);text-align:left;line-height:1.05;min-width:118px}
.boost b{font-family:var(--display);font-weight:400;font-size:.95rem;display:block;letter-spacing:.02em}
.boost small{font-size:.72rem;font-weight:800}
.boost:disabled{background:var(--surface-2);color:var(--muted);border-color:var(--line);box-shadow:0 3px 0 #0c0704;cursor:default}
.boost.on{animation:glow 1s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 3px 0 var(--gold-ink),0 0 18px 4px rgba(255,191,58,.55)}}
.toasts{position:absolute;left:10px;top:10px;right:140px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{align-self:flex-start;max-width:100%;background:rgba(20,12,7,.92);border:2px solid var(--line);border-radius:12px;padding:6px 10px;
  font-size:.82rem;animation:tin .25s ease-out}
.toast b{display:block;font-family:var(--display);font-weight:400;font-size:.95rem;color:var(--gold);letter-spacing:.02em}
.toast.cr b{color:var(--crystal)}
.toast.out{opacity:0;transform:translateY(-6px);transition:.3s}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
.banner{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;
  animation:ban 2.6s ease-in-out forwards;width:max-content;max-width:90%}
.banner small{display:block;font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;color:var(--text);text-shadow:0 2px 0 #000}
.banner b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(1.8rem,7vw,2.6rem);color:var(--gold);
  text-shadow:0 3px 0 var(--gold-ink),0 0 24px rgba(0,0,0,.8);text-wrap:balance}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-30%) scale(.9)}12%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%)}}

/* Panel */
.panel{background:var(--surface);border:2px solid var(--line);border-radius:20px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;background:var(--surface-2);border-bottom:2px solid var(--line)}
.tab{position:relative;border:0;background:transparent;border-radius:12px;padding:8px 2px;font-family:var(--display);font-size:.92rem;color:var(--muted);letter-spacing:.02em;font-weight:400}
.tab[aria-selected="true"]{background:var(--bg);color:var(--gold)}
.tab .dot{position:absolute;top:5px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--danger)}
.phead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px 4px;min-height:34px;flex-wrap:wrap}
.phead .ht{font-size:.82rem;color:var(--muted)}
.phead .ht b{color:var(--text);font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:3px 9px;font-size:.78rem;font-weight:900;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--text)}
.list{overflow-y:auto;padding:4px 10px 12px;display:flex;flex-direction:column;gap:8px;min-height:0;overscroll-behavior:contain}
.item{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface-2);border-radius:14px;padding:8px;border:2px solid transparent}
.item.locked{opacity:.6}
.item.pulse{border-color:var(--gold);animation:pul 1s ease-in-out infinite alternate}
@keyframes pul{to{box-shadow:0 0 0 4px rgba(255,191,58,.18)}}
.item.pr{background:linear-gradient(135deg,#2c1d3f,#22160e 70%);border-color:#4a3570}
.ic{width:52px;height:52px;border-radius:12px;background:#1a110b;display:grid;place-items:center;overflow:hidden}
.ic img{width:52px;height:52px;display:block}
.ic.sil img{filter:brightness(0) opacity(.55)}
.ic svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.c-gold{color:var(--gold)} .ic.c-cry{color:var(--crystal)} .ic.c-red{color:var(--danger)} .ic.c-grn{color:var(--good)} .ic.c-txt{color:var(--text)}
.tx{min-width:0}
.tx .t{font-family:var(--display);font-weight:400;font-size:1.02rem;letter-spacing:.01em;line-height:1.1}
.tx .m{font-size:.76rem;color:var(--gold);margin-top:2px;font-variant-numeric:tabular-nums}
.item.pr .tx .m,.item.tal .tx .m{color:var(--crystal)}
.tx .d{font-size:.76rem;color:var(--muted);margin-top:2px;line-height:1.3}
.buy{border:2px solid var(--gold-ink);border-radius:12px;background:linear-gradient(180deg,#ffd36b,var(--gold) 55%,var(--gold-deep));
  color:var(--gold-ink);box-shadow:0 3px 0 var(--gold-ink);padding:5px 8px 6px;min-width:84px;display:flex;flex-direction:column;align-items:center;gap:1px}
.buy:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--gold-ink)}
.buy .bl{font-size:.72rem;font-weight:900;text-transform:uppercase;letter-spacing:.04em}
.buy .bc{display:flex;align-items:center;gap:4px;font-family:var(--display);font-size:.98rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.buy.cry{background:linear-gradient(180deg,#d8c2ff,var(--crystal) 55%,#7b52e0);border-color:#2a1650;color:#1f0f3f;box-shadow:0 3px 0 #2a1650}
.buy:disabled{background:var(--bg);border-color:var(--line);color:var(--muted);box-shadow:0 3px 0 #0c0704;cursor:default}
.buy:disabled .coin{filter:grayscale(.7) brightness(.7)}

/* Collection */
.col h3{font-family:var(--display);font-weight:400;font-size:1.05rem;margin:10px 2px 6px;display:flex;justify-content:space-between;letter-spacing:.02em}
.col h3 span{font-family:var(--body);font-size:.8rem;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px}
.tile{background:var(--surface-2);border-radius:12px;padding:6px 4px;text-align:center;font-size:.7rem;color:var(--muted);line-height:1.2}
.tile img{width:48px;height:48px;display:block;margin:0 auto 4px;border-radius:8px}
.tile.off img{filter:brightness(0) opacity(.45)}
.tile.on{color:var(--text)}
.regions{display:flex;flex-direction:column;gap:4px}
.reg{display:flex;justify-content:space-between;gap:8px;background:var(--surface-2);border-radius:10px;padding:7px 10px;font-size:.8rem}
.reg span{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.reg.off{opacity:.5}
.ach{display:flex;gap:10px;align-items:center;background:var(--surface-2);border-radius:10px;padding:7px 10px;font-size:.8rem}
.ach i{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-style:normal;font-size:.7rem}
.ach.on i{background:var(--good);border-color:var(--good);color:var(--ink)}
.ach div{min-width:0}
.ach small{display:block;color:var(--muted)}
.achs{display:flex;flex-direction:column;gap:4px}
.note{font-size:.74rem;color:var(--muted);margin:6px 2px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.stats div{background:var(--surface-2);border-radius:10px;padding:6px 10px;font-size:.74rem;color:var(--muted)}
.stats b{display:block;color:var(--text);font-size:.92rem;font-variant-numeric:tabular-nums}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(8,4,2,.72);display:grid;place-items:center;z-index:20;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:20px;width:min(420px,100%);box-sizing:border-box;animation:tin .2s ease-out;max-height:90vh;overflow:auto}
.sheet h2{font-family:var(--display);font-weight:400;font-size:1.7rem;margin:0 0 6px;color:var(--gold);letter-spacing:.02em;text-wrap:balance}
.sheet p{color:var(--muted);font-size:.9rem;line-height:1.45;margin:0 0 12px}
.sheet .gain{font-family:var(--display);font-size:2.2rem;display:flex;align-items:center;gap:10px;margin:6px 0 12px;color:var(--gold)}
.sheet .gain.c{color:var(--crystal)}
.sheet ul{margin:0 0 14px;padding-left:18px;font-size:.84rem;color:var(--text);line-height:1.6}
.sheet .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.sheet .buy{min-width:120px;padding:8px 14px;font-family:var(--display);font-size:1.05rem;font-weight:400}
.ghost{border:2px solid var(--line);background:transparent;border-radius:12px;padding:8px 14px;font-weight:800}
.ghost.danger{color:var(--danger);border-color:#6a2a22}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:2px solid var(--line);gap:10px}
.setrow:first-of-type{border-top:0}
@media (max-width:420px){
  .res{padding:7px 9px;gap:8px}
  .res .big{font-size:1.3rem}
  .coin{width:24px;height:24px}
  .icon-btn{width:32px}
  .item{grid-template-columns:44px minmax(0,1fr) auto;gap:8px}
  .ic,.ic img{width:44px;height:44px}
  .buy{min-width:76px}
}
@media (prefers-reduced-motion:reduce){
  .banner,.toast,.item.pulse,.boost.on,.sheet{animation:none}
}
</style>

<div id="app">
  <header class="hud">
    <div class="res gold-res">
      <span class="coin" aria-hidden="true"></span>
      <div style="min-width:0">
        <div class="big" id="hGold">0</div>
        <div class="sub"><b id="hRate">0</b> /sn</div>
      </div>
    </div>
    <div class="res depth-res">
      <div class="row"><span class="lbl">Derinlik</span><span class="big" id="hDepth" style="font-size:1.2rem">0 m</span></div>
      <div class="bar" aria-hidden="true"><i id="hBar"></i></div>
      <div class="sub" id="hRegion" style="margin:0;white-space:normal">Başlangıç Madeni</div>
    </div>
    <div class="side">
      <div class="crys" title="Kristal"><span class="gem" aria-hidden="true"></span><span id="hCrys">0</span></div>
      <div class="hud-btns">
        <button class="icon-btn" id="bSound" aria-label="Sesi kapat"></button>
        <button class="icon-btn" id="bSet" aria-label="Ayarlar"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
      </div>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="cv" aria-label="Kazı alanı. Blokları kırmak için dokun."></canvas>
    <button class="boost" id="boost"><b>Altın Rüzgarı</b><small id="boostTxt">45 sn ×2</small></button>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div id="bannerHost"></div>
  </main>

  <section class="panel">
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="ekip" aria-selected="true">Kazı Ekibi<span class="dot" hidden></span></button>
      <button class="tab" role="tab" data-tab="gel" aria-selected="false">Geliştirme<span class="dot" hidden></span></button>
      <button class="tab" role="tab" data-tab="yet" aria-selected="false">Yetenekler<span class="dot" hidden></span></button>
      <button class="tab" role="tab" data-tab="kol" aria-selected="false">Koleksiyon<span class="dot" hidden></span></button>
    </nav>
    <div class="phead">
      <div class="ht" id="pHead"></div>
      <div class="seg" id="seg">
        <button data-mult="1" aria-pressed="true">×1</button>
        <button data-mult="10" aria-pressed="false">×10</button>
        <button data-mult="max" aria-pressed="false">Maks</button>
      </div>
    </div>
    <div class="list" id="list"></div>
  </section>
</div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
(()=>{

const BIOMES=[

let sprites=[],parts=[],floats=[],projs=[],swings=[];

function syncSprites(){
  WORKERS.forEach((w,i)=>{
    const want=dispCount(S.own[i]);let mine=sprites.filter(s=>s.i===i);
    while(mine.length>want){const s=mine.pop();sprites.splice(sprites.indexOf(s),1);}
    for(let k=mine.length;k<want;k++){
      const home=(i*2+k*3+1)%COLS;
      sprites.push({i,k,home,off:((k%3)-1)*.22,x:(home+.5)*B,y:camY-B*.5,vy:0,t:Math.random()*w.period,facing:k%2?-1:1,walk:0,landed:false});

}

  for(let k=0;k<lim&&parts.length<220;k++){
    const a=o.up?(-Math.PI/2+(Math.random()-.5)*2.2):Math.random()*Math.PI*2,sp=(o.speed||1)*(80+Math.random()*180);
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(o.up?60:0),life:0,max:o.life||(.5+Math.random()*.4),c:color,s:(o.size||1)*(2+Math.random()*4)*(B/60),k:o.kind||'deb',g:o.g==null?700:o.g});

function blockCenter(ci){return{x:(ci+.5)*B,y:(S.row.r+.5)*B};}

/* ================= GAMEPLAY ================= */
function addGold(v){S.gold+=v;S.stats.goldAll+=v;}
function hit(ci,dmg,src){
  const cell=S.row.cells[ci];if(!cell)return;
  cell.hp-=dmg;cell.shake=1;cell.flash=src==='tap'?1:.5;
  if(cell.hp<=0) breakBlock(ci);
}
function breakBlock(ci){
  const r=S.row.r,cell=S.row.cells[ci],T=BLOCKS[cell.t],{x,y}=blockCenter(ci);
  S.row.cells[ci]=null;S.stats.blocks++;
  const host=BLOCKS[hostFor(cell.t,r)];
  let goldV=hpAt(r)*T.gold*goldPerHp(r)*goldMult();
  if(T.chest){
    goldV=Math.max(goldRate()*30,hpAt(r)*goldPerHp(r)*goldMult()*25);S.stats.chests++;
    let cr=Math.random()<.35?1+Math.floor(Math.random()*3):0;
    if(cr){S.crystals+=cr;floatText(x,y-B*.45,`+${cr} kristal`,'#c9aaff',18,{max:1.4});}
    toast('Hazine sandığı!',`${fmt(goldV)} altın${cr?` ve ${cr} kristal`:''} buldun.`);SFX.chest();
    spawnParts(x,y,14,'#ffcc4d',{kind:'spark',up:1,g:200});
  }
  if(T.crystal){S.crystals+=1;floatText(x,y-B*.45,'+1 kristal','#c9aaff',18,{max:1.4});}
  if(T.mineral&&!S.found[cell.t]){S.found[cell.t]=1;toast('Yeni keşif',`${T.name} koleksiyona eklendi.`,T.crystal);}
  addGold(goldV);
  floatText(x,y,'+'+fmt(goldV),'#ffd25e',T.ore||T.chest?20:15);
  spawnParts(x,y,12,host.base,{speed:1.1});spawnParts(x,y,5,host.dark,{size:1.4});
  if(T.ore) spawnParts(x,y,7,T.ore,{size:1.2,up:1});
  spawnParts(x,y,Math.min(6,3+(T.gold|0)),'#ffc83a',{kind:'coin',up:1,size:1.1,life:.9});
  SFX.brk();SFX.coin();
  if(S.row.cells.every(c=>!c)) advance();
}
function advance(){
  S.depth++;S.runMax=Math.max(S.runMax,S.depth);
  const was=S.stats.bestDepth;S.stats.bestDepth=Math.max(S.stats.bestDepth,S.depth);
  const b=BIOMES[biomeIdx(S.depth)];
  if(S.depth===b.from&&S.depth>0){banner(was<S.depth?'Yeni bölge':'Bölge',b.name);SFX.region();wallCache.clear();}
  makeFront();
}
function tapAt(px){
  const ci=nearestAlive(clamp(Math.floor(px/B),0,COLS-1));if(ci<0)return;
  let d=tapDmg(),crit=Math.random()<critChance();

  S.stats.taps++;

  floatText(bx,by-B*.2,(crit?'KRİTİK! ':'')+fmt(d),crit?'#ff8a3d':'#fff6e8',crit?24:18);

function workerHit(sp,ci){
  const w=WORKERS[sp.i],n=dispCount(S.own[sp.i]);if(!n)return;
  const dmg=workerDps(sp.i)/n*w.period;
  const u=B*w.scale;
  if(w.area){projs.push({sx:sp.x+sp.facing*u*.3,sy:sp.y-u*.8,tx:(ci+.5)*B,ty:(S.row.r+.4)*B,t:0,dur:.45,dmg});return;}
  const {x}=blockCenter(ci),top=S.row.r*B;
  const host=BLOCKS[hostFor(S.row.cells[ci].t,S.row.r)];
  spawnParts(x+(Math.random()-.5)*B*.5,top+B*.1,w.draw==='exc'?8:3,host.spk,{up:1,speed:.7});
  if(w.draw==='exc') shake=Math.max(shake,2.5);
  if(floats.length<26&&dmg>=1) floatText(x+(Math.random()-.5)*B*.5,top+B*.25,fmt(dmg),'rgba(255,240,220,.75)',13,{max:.7,vy:40});

function explode(pj){
  const row=S.row,al=aliveIdx();
  spawnParts(pj.tx,pj.ty,18,'#ffb13a',{kind:'spark',speed:1.4,g:150});
  spawnParts(pj.tx,pj.ty,10,'rgba(80,70,65,.8)',{kind:'smoke',speed:.6,g:-60,size:3,life:1});
  shake=Math.max(shake,6);SFX.boom();
  if(!al.length)return;
  const each=pj.dmg/Math.sqrt(al.length);
  for(const ci of al){if(S.row!==row)break;if(row.cells[ci]){hit(ci,each,'w');}}

/* ================= UPDATE ================= */
function update(dt){
  time+=dt;
  const target=S.depth*B-H*.42;
  camY=lerp(camY,target,1-Math.pow(.0015,dt));
  shake*=Math.pow(.02,dt);
  for(const c of S.row.cells) if(c){c.shake=(c.shake||0)*Math.pow(.001,dt);c.flash=(c.flash||0)*Math.pow(.0005,dt);}
  // sprites
  for(const sp of sprites){
    const w=WORKERS[sp.i],ci=nearestAlive(sp.home);
    if(ci>=0){
      const tx=(ci+.5+sp.off)*B,dx=tx-sp.x,v=B*3.2*dt;
      if(Math.abs(dx)>1){sp.x+=clamp(dx,-v,v);sp.facing=dx>0?1:-1;sp.walk+=dt*16;}else sp.walk=0;
    }
    const col=clamp(Math.floor(sp.x/B),0,COLS-1),ground=(S.row.cells[col]?S.row.r:S.row.r+1)*B;
    if(sp.y<ground-.5){sp.vy+=1600*dt;sp.y=Math.min(ground,sp.y+sp.vy*dt);if(sp.y>=ground){if(sp.vy>400)spawnParts(sp.x,ground,6,'rgba(200,170,140,.6)',{kind:'smoke',speed:.4,g:-30,size:2});sp.vy=0;}}
    else if(sp.y>ground){sp.y=Math.max(ground,sp.y-B*4*dt);sp.vy=0;}
    sp.t+=dt;
    if(sp.t>=w.period){sp.t-=w.period;if(ci>=0&&S.row.cells[ci])workerHit(sp,ci);}
  }
  for(let k=projs.length-1;k>=0;k--){const pj=projs[k];pj.t+=dt;if(pj.t>=pj.dur){projs.splice(k,1);explode(pj);}}
  for(let k=parts.length-1;k>=0;k--){const p=parts[k];p.life+=dt;if(p.life>=p.max){parts.splice(k,1);continue;}p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.3,dt);}
  for(let k=floats.length-1;k>=0;k--){const f=floats[k];f.life+=dt;f.y+=f.vy*dt;if(f.life>=f.max)floats.splice(k,1);}
  for(let k=swings.length-1;k>=0;k--){swings[k].t+=dt;if(swings[k].t>.28)swings.splice(k,1);}
  // ambient sparkle on gems in front row
  if(Math.random()<dt*3){const ci=Math.floor(Math.random()*COLS),c=S.row.cells[ci];if(c&&(BLOCKS[c.t].gem||BLOCKS[c.t].chest)){spawnParts((ci+.2+Math.random()*.6)*B,(S.row.r+.2+Math.random()*.6)*B,1,'#fff',{kind:'spark',speed:.05,g:0,life:.6});}}
  if(boostOn()&&Math.random()<dt*10) spawnParts(Math.random()*W,camY+Math.random()*H*.5,1,'#ffd25e',{kind:'spark',speed:.1,g:-40,life:1});
  S.last=now();
}

/* ================= RENDER ================= */
function crackLines(cell,ci){
  if(cell.cr) return cell.cr;
  const R=rng(strSeed('c'+S.row.r+'_'+ci)+S.seed),lines=[];
  for(let k=0;k<6;k++){let x=.5+(R()-.5)*.2,y=.5+(R()-.5)*.2,a=R()*Math.PI*2;const pts=[[x,y]];for(let j=0;j<4;j++){a+=(R()-.5)*1.2;x+=Math.cos(a)*.11;y+=Math.sin(a)*.11;pts.push([clamp(x,.04,.96),clamp(y,.04,.96)]);}lines.push(pts);}
  cell.cr=lines;return lines;
}
function render(){
  g.setTransform(DPR,0,0,DPR,0,0);

    g.fillStyle=gr;g.fillRect(-10,0,W+20,skyH+1);
    g.fillStyle='#ffe2a0';circ(g,W*.78,skyH-B*.9,B*.45);g.fill();
    g.fillStyle='#5a3a3a';g.beginPath();g.moveTo(-10,skyH);for(let x=0;x<=W+10;x+=W/8)g.lineTo(x,skyH-B*(.35+.25*Math.sin(x*.02+1)));g.lineTo(W+10,skyH);g.fill();
    g.fillStyle='#3e2a26';g.beginPath();g.moveTo(-10,skyH);for(let x=0;x<=W+10;x+=W/6)g.lineTo(x,skyH-B*(.15+.15*Math.sin(x*.035+3)));g.lineTo(W+10,skyH);g.fill();
    // sign
    const px=B*.55,py=skyH-B*.2;
    g.fillStyle='#6b4423';g.fillRect(px-B*.04,py-B*.6,B*.08,B*.6);
    rr(g,px-B*.5,py-B*.85,B*1.15,B*.32,B*.05);fs(g,'#a8743f',2);
    g.fillStyle='#2a1708';g.font=`${Math.round(B*.2)}px "Lilita One","Trebuchet MS",sans-serif`;g.textAlign='center';g.textBaseline='middle';g.fillText('YERİN ALTI',px+B*.08,py-B*.68);
  }
  // cleared shaft rows
  const firstRow=Math.max(0,Math.floor(cy/B)),lastRow=Math.ceil((cy+H)/B);
  for(let r=firstRow;r<S.row.r&&r<=lastRow;r++){
    const t=wallTile(biomeIdx(r));g.drawImage(t,0,(r%4)*B*DPR,t.width,B*DPR,0,r*B-cy,W,B+.5);
  }
  if(S.row.r>0&&firstRow<S.row.r){

    g.fillStyle='#5b3b20';g.fillRect(0,top,B*.12,bot-top);g.fillRect(W-B*.12,top,B*.12,bot-top);
    g.fillStyle='rgba(0,0,0,.3)';g.fillRect(B*.09,top,B*.03,bot-top);g.fillRect(W-B*.12,top,B*.03,bot-top);
    for(let r=Math.max(1,firstRow);r<S.row.r;r++){
      if(r%8!==0)continue;const y=r*B-cy;
      rr(g,0,y-B*.07,W,B*.14,B*.03);fs(g,'#6b4423',2);
      const lx=W*(r%16===0?.3:.7),ly=y+B*.35;
      g.strokeStyle='#222';g.lineWidth=1.5;g.beginPath();g.moveTo(lx,y+B*.07);g.lineTo(lx,ly-B*.1);g.stroke();
      const glow=g.createRadialGradient(lx,ly,0,lx,ly,B*1.6);glow.addColorStop(0,'rgba(255,190,90,.35)');glow.addColorStop(1,'rgba(255,190,90,0)');
      g.fillStyle=glow;g.fillRect(lx-B*1.6,ly-B*1.6,B*3.2,B*3.2);
      rr(g,lx-B*.08,ly-B*.12,B*.16,B*.22,B*.04);fs(g,'#ffd77a',1.5);

  }
  // blocks
  for(let r=Math.max(S.row.r,firstRow);r<=lastRow;r++){

    for(let c=0;c<COLS;c++){
      if(r===S.row.r){
        const cell=S.row.cells[c];if(!cell)continue;
        const sh=(cell.shake||0)*B*.04,ox=(Math.random()-.5)*sh,oy=(Math.random()-.5)*sh;
        const tex=blockTex(cell.t,hostFor(cell.t,r),(r*7+c)%3);
        g.drawImage(tex,c*B+ox,y+oy,B,B);
        const frac=1-cell.hp/cell.max;

          const lines=crackLines(cell,c),showN=frac*lines.length*4;

          for(let k=0;k<lines.length;k++){
            const segs=clamp(showN-k*4,0,4);if(segs<=0)continue;

          rr(g,c*B+B*.14,y+B*.82,B*.72*(1-frac),B*.07,B*.035);g.fillStyle='#ffc83a';g.fill();

      }
    }
    if(r===0){g.fillStyle='#5aa043';for(let c=0;c<COLS;c++){if(r===S.row.r&&!S.row.cells[c])continue;g.fillRect(c*B,y-B*.02,B,B*.1);g.fillStyle='#78c25a';g.fillRect(c*B,y-B*.02,B,B*.04);g.fillStyle='#5aa043';}}
  }
  // depth fog
  const fy=S.row.r*B-cy+B*.9,fog=BIOMES[biomeIdx(S.row.r)].fog;
  const fg=g.createLinearGradient(0,fy,0,H);fg.addColorStop(0,`rgba(${fog},0)`);fg.addColorStop(1,`rgba(${fog},.88)`);
  g.fillStyle=fg;g.fillRect(-10,fy,W+20,H-fy+10);
  // ruler

  for(let r=firstRow;r<=lastRow;r++){
    const y=r*B-cy;g.fillStyle='rgba(255,240,220,.35)';g.fillRect(0,y,r%5===0?B*.18:B*.08,1.5);
    if(r%5===0&&r>0){g.fillStyle='rgba(0,0,0,.55)';rr(g,B*.2,y-8,B*.62,16,6);g.fill();g.fillStyle='rgba(255,240,220,.85)';g.fillText(r+' m',B*.26,y+.5);}
  }
  // sprites
  sprites.sort((a,b)=>a.i-b.i);
  for(const sp of sprites){
    const w=WORKERS[sp.i],u=B*w.scale,x=sp.x,y=sp.y-cy;
    g.fillStyle='rgba(0,0,0,.3)';ell(g,x,y,u*.32,u*.06);g.fill();
    g.save();g.translate(x,y-(sp.walk?Math.abs(Math.sin(sp.walk))*u*.04:0));g.scale(sp.facing,1);
    drawWorker(g,sp.i,u,sp.t/w.period,sp.walk);g.restore();
  }
  // projectiles
  for(const pj of projs){
    const t=pj.t/pj.dur,x=lerp(pj.sx,pj.tx,t),y=lerp(pj.sy,pj.ty,t)-Math.sin(t*Math.PI)*B*.8-cy;
    g.save();g.translate(x,y);g.rotate(t*9);rr(g,-B*.1,-B*.04,B*.2,B*.08,B*.02);fs(g,'#e2443a',1.5);
    g.fillStyle=(time*24|0)%2?'#fff3a0':'#ff9a2a';circ(g,B*.12,0,B*.035);g.fill();g.restore();
  }
  // particles
  for(const p of parts){
    const a=1-p.life/p.max,x=p.x,y=p.y-cy;g.globalAlpha=Math.max(0,a);
    if(p.k==='coin'){g.fillStyle='#ffc83a';ell(g,x,y,p.s*Math.abs(Math.cos(time*12+p.vx)),p.s);g.fill();g.strokeStyle='#8a5a10';g.lineWidth=1;g.stroke();}
    else if(p.k==='spark'){g.fillStyle=p.c;g.save();g.translate(x,y);g.rotate(Math.PI/4);g.fillRect(-p.s*.5,-p.s*.5,p.s,p.s);g.restore();}
    else if(p.k==='smoke'){g.fillStyle=p.c;circ(g,x,y,p.s*(1+p.life*2));g.fill();}
    else{g.fillStyle=p.c;g.fillRect(x-p.s/2,y-p.s/2,p.s,p.s);}
  }
  g.globalAlpha=1;
  // tap pickaxe swings

    const t=s.t/.28,ang=lerp(-1.4,.5,easeIn(Math.min(1,t*1.6)));
    g.save();g.globalAlpha=1-Math.max(0,t-.6)/.4;g.translate(s.x+B*.25,s.y-cy-B*.1);g.rotate(ang);
    g.lineCap='round';g.lineWidth=B*.07;g.strokeStyle=INK;g.beginPath();g.moveTo(0,0);g.lineTo(-B*.42,0);g.stroke();g.lineWidth=B*.04;g.strokeStyle='#a46a3a';g.stroke();
    g.beginPath();g.moveTo(-B*.38,-B*.2);g.quadraticCurveTo(-B*.58,0,-B*.38,B*.2);g.quadraticCurveTo(-B*.5,0,-B*.38,-B*.2);fs(g,'#dfe6ee',2);

  }
  g.globalAlpha=1;
  // floating text

  for(const f of floats){

    g.font=`${Math.round(f.s*(B/60)*.9+3)}px "Lilita One","Trebuchet MS",sans-serif`;

      g.font=`${Math.round(clamp(B*.3,16,24))}px "Lilita One","Trebuchet MS",sans-serif`;g.lineWidth=4;g.strokeStyle='rgba(30,15,5,.9)';
      const ty=S.row.r*B-cy-B*1.1+Math.sin(time*4)*3;g.strokeText('Bloklara dokun!',W/2,ty);g.fillStyle='#ffd25e';g.fillText('Bloklara dokun!',W/2,ty);

  g.fillStyle=vg;g.fillRect(0,0,W,H);
}

    if(key!==listKey){listEl.innerHTML=items.map(itemHTML).join('');listKey=key;colHTML='';}
    curItems=new Map(items.map(i=>[i.key,i]));
    for(const it of items){
      const el=listEl.querySelector(`[data-i="${it.key}"]`);if(!el)continue;
      const set=(f,v)=>{const n=el.querySelector(`[data-f="${f}"]`);if(n&&n.textContent!==v)n.textContent=v;};
      set('t',it.t);set('m',it.m);set('d',it.d);if(!it.nobtn){set('b',it.b);set('c',it.c);const bt=el.querySelector('button');bt.disabled=!it.can;}
      el.classList.toggle('pulse',!!it.pulse);
    }
  }
  // tab dots
  const dots={ekip:buildItems('ekip').some(i=>i.can),gel:buildItems('gel').some(i=>i.can),yet:buildItems('yet').some(i=>i.can),kol:false};
  document.querySelectorAll('.tab').forEach(b=>{b.querySelector('.dot').hidden=!dots[b.dataset.tab]||b.dataset.tab===tab;});
}
function collectionHTML(){
  const best=S.stats.bestDepth;
  let h='<div class="col">';
  h+=`<h3>Kazı Ekibi <span>${WORKERS.filter((w,i)=>S.own[i]>0||S.stats.runs>0&&S.found['w'+i]).length}/${WORKERS.length}</span></h3><div class="tiles">`;
  WORKERS.forEach((w,i)=>{const on=S.own[i]>0||S.found['w'+i];h+=`<div class="tile ${on?'on':'off'}"><img alt="" src="${portrait(i)}">${on?w.name:'???'}</div>`;});
  h+=`</div><p class="note">Sonraki güncellemelerde 20 ekip daha: hayvanlar, makineler ve fantastik ekipler.</p>`;
  h+=`<h3>Bölgeler <span>${BIOMES.filter(b=>best>=b.from).length}/${BIOMES.length+FUTURE.length}</span></h3><div class="regions">`;
  BIOMES.forEach(b=>{const on=best>=b.from;h+=`<div class="reg ${on?'':'off'}"><b>${on?b.name:'???'}</b><span>${b.from}–${b.to===Infinity?'…':b.to} m</span></div>`;});
  FUTURE.slice(0,3).forEach(n=>{h+=`<div class="reg off"><b>${n}</b><span>Yakında</span></div>`;});
  h+=`</div><h3>Madenler <span>${MINERALS.filter(m=>S.found[m]).length}/${MINERALS.length}</span></h3><div class="tiles">`;
  MINERALS.forEach(m=>{const on=S.found[m];h+=`<div class="tile ${on?'on':'off'}"><img alt="" src="${thumb(m)}">${on?BLOCKS[m].name:'???'}</div>`;});
  h+=`</div><h3>Başarımlar <span>${achCount()}/${ACH.length}</span></h3><div class="achs">`;
  ACH.forEach(a=>{const on=S.ach[a.id];h+=`<div class="ach ${on?'on':''}"><i>${on?'✓':''}</i><div><b>${a.name}</b><small>${a.desc}</small></div></div>`;});
  h+=`</div><h3>İstatistikler</h3><div class="stats">
    <div>En derin<b>${best.toLocaleString('tr-TR')} m</b></div><div>Kırılan blok<b>${S.stats.blocks.toLocaleString('tr-TR')}</b></div>
    <div>Dokunuş<b>${S.stats.taps.toLocaleString('tr-TR')}</b></div><div>Toplam altın<b>${fmt(S.stats.goldAll)}</b></div>
    <div>Açılan sandık<b>${S.stats.chests}</b></div><div>Tamamlanan sefer<b>${S.stats.runs}</b></div></div></div>`;
  return h;
}
function checkAch(){
  WORKERS.forEach((w,i)=>{if(S.own[i]>0)S.found['w'+i]=1;});
  for(const a of ACH){if(!S.ach[a.id]&&a.t()){S.ach[a.id]=1;toast('Başarım: '+a.name,a.desc+' · altın +%3');SFX.ach();}}
}

/* --- modals --- */
const modal=$('modal'),sheet=$('sheet');let modalActs={};
function openModal(html,acts){sheet.innerHTML=html;modalActs=acts||{};modal.hidden=false;const b=sheet.querySelector('.buy,button');if(b)b.focus();}
function closeModal(){modal.hidden=true;modalActs={};}
sheet.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;SFX.ui();const f=modalActs[b.dataset.act];if(f)f(b);else closeModal();});
modal.addEventListener('click',e=>{if(e.target===modal&&!modalActs.__lock)closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden&&!modalActs.__lock)closeModal();});
function openPrestige(){
  const n=crystalsFor();
  openModal(`<h2>Yeni Sefer</h2><p>Bu kazıyı burada bitirip yüzeye çıkarsan kalıcı kristaller kazanırsın. Kristallerle Yetenekler sekmesinden kalıcı güçler öğrenirsin.</p>
    <div class="gain c"><span class="gem lg"></span>+${fmt(n)} kristal</div>
    <ul><li><b>Sıfırlanır:</b> derinlik (${S.runMax} m), altın, kazı ekibi, geliştirmeler</li><li><b>Kalır:</b> kristaller, yetenekler, başarımlar, koleksiyon</li>
    ${tal('sermaye')?`<li><b>Başlangıç:</b> ${fmt(startGold())} altın</li>`:''}</ul>
    <div class="acts"><button class="ghost" data-act="close">Vazgeç</button><button class="buy cry" data-act="go">Sefere çık</button></div>`,
    {go:()=>{doPrestige(n);closeModal();}});
}
function doPrestige(n){
  const keep={crystals:S.crystals+n,tal:S.tal,ach:S.ach,found:S.found,stats:S.stats,sound:S.sound,buyMult:S.buyMult};
  const nf=fresh();S=Object.assign(nf,keep);S.stats.runs++;S.gold=startGold();
  rowCache.clear();makeFront();sprites=[];parts=[];floats=[];projs=[];camY=-H*.42;
  banner(`Sefer ${S.stats.runs+1}`,'Yeniden aşağı!');SFX.region();S.tab='yet';listKey='';save();
}
function openSettings(step){
  openModal(`<h2>Ayarlar</h2>
    <div class="setrow"><span>Ses efektleri</span><button class="ghost" data-act="snd">${S.sound?'Açık':'Kapalı'}</button></div>
    <div class="setrow"><span>Oyun kendini her 5 saniyede bu tarayıcıya kaydeder.</span></div>
    <div class="setrow"><span>${step?'Bütün ilerleme, kristaller ve yetenekler silinir. Emin misin?':'Bütün ilerlemeyi sil'}</span>
      <button class="ghost danger" data-act="${step?'wipe':'reset'}">${step?'Evet, sil':'Sıfırla'}</button></div>
    <div class="acts" style="margin-top:12px"><button class="buy" data-act="close">Tamam</button></div>`,
    {snd:()=>{S.sound=!S.sound;openSettings(step);updateHud();},reset:()=>openSettings(true),
     wipe:()=>{try{localStorage.removeItem(SAVE_KEY);}catch(e){}S=fresh();rowCache.clear();makeFront();sprites=[];parts=[];floats=[];projs=[];camY=-H*.42;listKey='';closeModal();save();}});
}
function grantAway(sec,showModal){
  const cap=offlineCap(),eff=offlineEff(),t=Math.min(sec,cap),rate=goldRate(true);
  if(rate<=0||t<5) return;
  const v=rate*t*eff;
  if(!showModal||t<60){addGold(v);return;}
  openModal(`<h2>Tekrar hoş geldin!</h2><p>Sen yokken ekibin ${dur(t)} boyunca kazmaya devam etti${sec>cap?` (sınır ${dur(cap)})`:''}.</p>
    <div class="gain"><span class="coin"></span>+${fmt(v)}</div><p>Çevrimdışı verim %${Math.round(eff*100)}. Gece Vardiyası ve Uyumayan Maden bunu artırır.</p>
    <div class="acts"><button class="buy" data-act="ok">Topla</button></div>`,{__lock:1,ok:()=>{addGold(v);SFX.coin();closeModal();}});
}

/* ================= INPUT ================= */
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();const r=cv.getBoundingClientRect();tapAt(e.clientX-r.left);
});
listEl.addEventListener('click',e=>{
  const b=e.target.closest('button[data-k]');if(!b||b.disabled)return;
  const it=curItems.get(b.dataset.k);if(!it||!it.act)return;
  if(it.act()){SFX.buy();checkAch();}
  renderPanel();updateHud();
});
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;S.tab=b.dataset.tab;SFX.ui();listEl.scrollTop=0;renderPanel();});
$('seg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.buyMult=b.dataset.mult==='max'?'max':+b.dataset.mult;SFX.ui();renderPanel();});
$('boost').addEventListener('click',()=>{const n=now();if(n<S.boostReady)return;S.boostEnd=n+45000;S.boostReady=n+45000+240000;banner('Altın Rüzgarı','45 sn ×2');SFX.region();updateHud();});
$('bSound').addEventListener('click',()=>{S.sound=!S.sound;if(S.sound)SFX.ui();updateHud();});
$('bSet').addEventListener('click',()=>openSettings(false));
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){save();}
  else{const away=(now()-S.last)/1000;if(away>5)grantAway(away,true);S.last=now();}
});
window.addEventListener('pagehide',save);

/* ================= BOOT ================= */
let lastT=0,uiAcc=0,saveAcc=0;
function frame(ts){
  const dt=Math.min(.1,lastT?(ts-lastT)/1000:0);lastT=ts;
  update(dt);render();
  uiAcc+=dt;saveAcc+=dt;
  if(uiAcc>.2){uiAcc=0;updateHud();renderPanel();checkAch();}
  if(saveAcc>5){saveAcc=0;save();}
  requestAnimationFrame(frame);
}
function start(data){
  S=(data&&data.state)?Object.assign(fresh(),data.state):(load()||fresh());
  const away=(now()-S.last)/1000;
  if(!S.row||S.row.r!==S.depth)makeFront();
  resize();camY=S.depth*B-H*.42;
  syncSprites();sprites.forEach(s=>{s.y=(S.row.r)*B;});
  new ResizeObserver(()=>{resize();}).observe(stage);
  window.claude?.hot?.snapshot?.(()=>({state:serial()}));
  updateHud();renderPanel();
  if(!(data&&data.state)&&away>5)grantAway(away,true);
  S.last=now();
  requestAnimationFrame(frame);
}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
