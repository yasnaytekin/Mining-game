<title>Yerin Altı</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: compact resource HUD (~10%) · big mine-shaft canvas (~48%) · crew/upgrade panel (~35%) · bottom nav (~7%).
   Wide screens: shaft on the left, panel + nav on the right. Single deliberate dark-anthracite theme;
   warm earth colours live only inside the game world. */
:root{
  --bg:#14161b;
  --surface:#1d2027;
  --surface-2:#262a33;
  --surface-3:#30353f;
  --text:#f3f4f7;
  --muted:#9aa1ad;
  --gold:#ffcb3d;
  --accent:#ff8a2b;
  --accent-deep:#c25a12;
  --crystal:#a979ff;
  --crystal-deep:#6c3fd1;
  --good:#5fd38d;
  --danger:#ff6b5e;
  --display:"Lilita One","Trebuchet MS","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-weight:700;overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{box-sizing:border-box;height:100%;max-width:1180px;margin:0 auto;display:grid;
  grid-template-rows:auto minmax(0,1fr) minmax(0,35%) auto;gap:8px;
  grid-template-areas:"hud" "stage" "panel" "nav";
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud{grid-area:hud}.stage{grid-area:stage}.panel{grid-area:panel}.nav{grid-area:nav}
@media (min-width:880px){
  #app{grid-template-columns:minmax(0,1fr) 410px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:12px;
    grid-template-areas:"hud hud" "stage panel" "stage nav"}
}

/* HUD: one compact band */
.hud{display:flex;gap:6px;align-items:center;min-width:0}
.pill{display:flex;align-items:center;gap:7px;background:var(--surface);border-radius:999px;padding:5px 12px 5px 6px;min-width:0;height:40px;box-sizing:border-box}
.pill b{font-family:var(--display);font-weight:400;font-size:1.25rem;line-height:1;letter-spacing:.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill small{display:block;font-size:.68rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.1}
.pill .stack{min-width:0;overflow:hidden}
.pill.gold{flex:1 1 auto}
.pill.gold b{color:var(--gold)}
.pill.depth{flex:0 1 auto;padding-left:10px}
.pill.depth svg{width:16px;height:16px;flex:none;stroke:var(--accent);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.pill.cry{flex:0 0 auto;padding-left:10px}
.pill.cry b{color:var(--crystal)}
.pill.bump{animation:bump .22s ease-out}
@keyframes bump{40%{transform:scale(1.07)}}
.icon-btn{flex:none;width:40px;height:40px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:var(--text);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.coin{display:inline-block;width:28px;height:28px;flex:none;border-radius:50%;background:var(--gold);
  box-shadow:inset 0 -3px 0 #d99a12,inset 0 0 0 2px #b37808;position:relative}
.coin::after{content:"";position:absolute;left:28%;top:22%;width:26%;height:26%;border-radius:50%;background:#fff3c2}
.coin.sm{width:14px;height:14px;box-shadow:inset 0 -1.5px 0 #d99a12,inset 0 0 0 1.5px #b37808}
.gem{display:inline-block;width:16px;height:18px;flex:none;background:var(--crystal);clip-path:polygon(50% 0,100% 36%,50% 100%,0 36%);position:relative}
.gem::after{content:"";position:absolute;inset:0;background:#e2d2ff;clip-path:polygon(50% 0,100% 36%,50% 50%)}
.gem.sm{width:12px;height:14px}
.gem.lg{width:22px;height:26px}

/* Stage */
.stage{position:relative;border-radius:22px;overflow:hidden;background:#0c0b0e;min-height:0;touch-action:none}
#cv{display:block;width:100%;height:100%;touch-action:none;cursor:pointer}
.region{position:absolute;left:10px;top:10px;background:rgba(14,15,20,.78);border-radius:14px;padding:6px 10px 7px;min-width:132px;max-width:46%;pointer-events:none;backdrop-filter:blur(4px)}
.region b{display:block;font-family:var(--display);font-weight:400;font-size:.92rem;letter-spacing:.02em;line-height:1.1}
.region small{display:block;font-size:.68rem;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.rbar{height:5px;border-radius:5px;background:rgba(255,255,255,.12);margin-top:5px;overflow:hidden}
.rbar i{display:block;height:100%;width:0;background:var(--accent);border-radius:5px;transition:width .3s}
.boost{position:absolute;right:10px;top:10px;display:flex;align-items:center;gap:7px;border-radius:999px;
  background:var(--gold);color:#3a2604;padding:6px 12px 6px 6px;box-shadow:0 3px 0 #b37808}
.boost .bi{width:28px;height:28px;border-radius:50%;background:#3a2604;display:grid;place-items:center;font-family:var(--display);color:var(--gold);font-size:.85rem}
.boost b{display:block;font-family:var(--display);font-weight:400;font-size:.85rem;line-height:1}
.boost small{display:block;font-size:.66rem;font-weight:900;line-height:1.2;font-variant-numeric:tabular-nums}
.boost:disabled{background:rgba(14,15,20,.78);color:var(--muted);box-shadow:none;cursor:default}
.boost:disabled .bi{background:var(--surface-3);color:var(--muted)}
.boost.on{background:var(--gold);color:#3a2604;animation:glow .9s ease-in-out infinite alternate}
.boost.on .bi{background:#3a2604;color:var(--gold)}
@keyframes glow{to{box-shadow:0 0 0 4px rgba(255,203,61,.35),0 0 22px 6px rgba(255,203,61,.45)}}
.toasts{position:absolute;left:10px;right:10px;bottom:12px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{max-width:100%;background:rgba(14,15,20,.9);border-radius:12px;padding:6px 12px;font-size:.78rem;text-align:center;animation:tin .25s ease-out}
.toast b{display:block;font-family:var(--display);font-weight:400;font-size:.95rem;color:var(--gold);letter-spacing:.02em}
.toast.cr b{color:var(--crystal)}
.toast.out{opacity:0;transform:translateY(-6px);transition:.3s}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
.banner{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;
  animation:ban 2.6s ease-in-out forwards;width:max-content;max-width:90%}
.banner small{display:block;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:#fff;text-shadow:0 2px 0 #000}
.banner b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(1.9rem,7vw,2.8rem);color:var(--gold);
  text-shadow:0 3px 0 #6b3a00,0 0 26px rgba(0,0,0,.85);text-wrap:balance}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-30%) scale(.85)}12%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%)}}

/* Panel */
.panel{background:var(--surface);border-radius:22px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.phead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px 6px;flex-wrap:wrap}
.phead h2{margin:0;font-family:var(--display);font-weight:400;font-size:1.08rem;letter-spacing:.02em;line-height:1}
.phead .ht{font-size:.74rem;color:var(--muted);margin-top:3px}
.phead .ht b{color:var(--text);font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--bg);border-radius:999px;padding:3px;gap:2px}
.seg button{border-radius:999px;padding:4px 10px;font-size:.74rem;font-weight:900;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--text)}
.list{overflow-y:auto;padding:2px 8px 10px;display:flex;flex-direction:column;gap:6px;min-height:0;overscroll-behavior:contain}
.item{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface-2);border-radius:16px;padding:6px 8px 6px 6px;box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .2s}
.item.locked{opacity:.55}
.item.pulse{box-shadow:inset 0 0 0 2px var(--accent);animation:pul .9s ease-in-out infinite alternate}
@keyframes pul{to{box-shadow:inset 0 0 0 2px var(--accent),0 0 0 4px rgba(255,138,43,.18)}}
.item.pr{background:#2c2440}
.ic{width:60px;height:60px;border-radius:14px;background:var(--tint,var(--surface-3));display:grid;place-items:center;overflow:hidden}
.ic img{width:60px;height:60px;display:block}
.ic.sil img{filter:brightness(0) opacity(.5)}
.ic svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ic.c-gold{color:var(--gold)}.ic.c-cry{color:var(--crystal)}.ic.c-red{color:var(--danger)}.ic.c-grn{color:var(--good)}.ic.c-acc{color:var(--accent)}
.tx{min-width:0}
.tx .t{display:flex;align-items:center;gap:6px;min-width:0}
.tx .t span:first-child{font-family:var(--display);font-weight:400;font-size:1.02rem;letter-spacing:.01em;line-height:1.1;overflow-wrap:anywhere}
.tag{flex:none;font-size:.64rem;font-weight:900;background:var(--surface-3);color:var(--text);border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums}
.tx .m{font-size:.8rem;color:var(--gold);margin-top:2px;font-weight:900;font-variant-numeric:tabular-nums}
.tx .m em{font-style:normal;color:var(--good);font-weight:800}
.item.pr .tx .m,.item.tal .tx .m{color:var(--crystal)}
.tx .d{font-size:.72rem;color:var(--muted);margin-top:2px;line-height:1.3}
.pb{height:4px;border-radius:4px;background:var(--surface-3);margin-top:4px;overflow:hidden;max-width:160px}
.pb i{display:block;height:100%;background:var(--accent);border-radius:4px}
.buy{border-radius:14px;background:var(--accent);color:#fff;box-shadow:0 3px 0 var(--accent-deep);padding:6px 10px 7px;min-width:86px;
  display:flex;flex-direction:column;align-items:center;gap:2px}
.buy:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--accent-deep)}
.buy .bl{font-size:.66rem;font-weight:900;text-transform:uppercase;letter-spacing:.06em;opacity:.95}
.buy .bc{display:flex;align-items:center;gap:4px;font-family:var(--display);font-size:1rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.buy.cry{background:var(--crystal);box-shadow:0 3px 0 var(--crystal-deep)}
.buy:disabled{background:var(--surface-3);color:var(--muted);box-shadow:0 3px 0 #1a1d23;cursor:default}
.buy:disabled .coin,.buy:disabled .gem{filter:saturate(.3) brightness(.75)}

/* Bottom nav */
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);border-radius:20px;padding:5px}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:15px;padding:6px 2px 5px;color:var(--muted);font-size:.68rem;font-weight:900}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-selected="true"]{background:var(--surface-3);color:var(--accent)}
.nav .dot{position:absolute;top:5px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 2px var(--surface)}

/* Collection */
.col h3{font-family:var(--display);font-weight:400;font-size:1rem;margin:8px 4px 6px;display:flex;justify-content:space-between;letter-spacing:.02em}
.col h3 span{font-family:var(--body);font-size:.76rem;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px}
.tile{background:var(--surface-2);border-radius:12px;padding:6px 4px;text-align:center;font-size:.68rem;color:var(--muted);line-height:1.2}
.tile img{width:48px;height:48px;display:block;margin:0 auto 4px;border-radius:8px}
.tile.off img{filter:brightness(0) opacity(.45)}
.tile.on{color:var(--text)}
.regions,.achs{display:flex;flex-direction:column;gap:4px}
.reg{display:flex;justify-content:space-between;gap:8px;background:var(--surface-2);border-radius:10px;padding:7px 10px;font-size:.78rem}
.reg span{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.reg.off{opacity:.5}
.ach{display:flex;gap:10px;align-items:center;background:var(--surface-2);border-radius:10px;padding:7px 10px;font-size:.78rem}
.ach i{width:20px;height:20px;border-radius:50%;background:var(--surface-3);flex:none;display:grid;place-items:center;font-style:normal;font-size:.7rem}
.ach.on i{background:var(--good);color:#10301d}
.ach div{min-width:0}
.ach small{display:block;color:var(--muted)}
.note{font-size:.72rem;color:var(--muted);margin:6px 4px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.stats div{background:var(--surface-2);border-radius:10px;padding:6px 10px;font-size:.72rem;color:var(--muted)}
.stats b{display:block;color:var(--text);font-size:.9rem;font-variant-numeric:tabular-nums}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(6,7,10,.74);display:grid;place-items:center;z-index:20;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{background:var(--surface);border-radius:24px;padding:20px;width:min(400px,100%);box-sizing:border-box;animation:tin .2s ease-out;max-height:88vh;overflow:auto}
.sheet h2{font-family:var(--display);font-weight:400;font-size:1.7rem;margin:0 0 6px;color:var(--gold);letter-spacing:.02em;text-wrap:balance}
.sheet p{color:var(--muted);font-size:.88rem;line-height:1.45;margin:0 0 12px}
.sheet .gain{font-family:var(--display);font-size:2.2rem;display:flex;align-items:center;gap:10px;margin:6px 0 12px;color:var(--gold)}
.sheet .gain.c{color:var(--crystal)}
.sheet ul{margin:0 0 14px;padding-left:18px;font-size:.84rem;line-height:1.6}
.sheet .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.sheet .buy{min-width:120px;padding:9px 16px;font-family:var(--display);font-size:1.05rem}
.ghost{background:var(--surface-2);border-radius:12px;padding:9px 14px;font-weight:800}
.ghost.danger{color:var(--danger)}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;gap:10px;font-size:.88rem}
.setrow+.setrow{border-top:1px solid var(--surface-3)}
@media (max-width:420px){
  .pill{padding-right:9px;gap:6px}
  .pill b{font-size:1.08rem}
  .coin{width:24px;height:24px}
  .item{grid-template-columns:54px minmax(0,1fr) auto;gap:8px}
  .ic,.ic img{width:54px;height:54px}
  .buy{min-width:78px;padding-inline:8px}
}
@media (max-width:360px){.pill.gold small{display:none}}
@media (prefers-reduced-motion:reduce){
  .banner,.toast,.item.pulse,.boost.on,.sheet,.pill.bump{animation:none}
}
</style>

<div id="app">
  <header class="hud">
    <div class="pill gold" id="pGold" title="Altın">
      <span class="coin" aria-hidden="true"></span>
      <div class="stack"><b id="hGold">0</b><small id="hRate">+0/sn</small></div>
    </div>
    <div class="pill depth" title="Derinlik">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v15M6 13l6 6 6-6"/></svg>
      <b id="hDepth">0 m</b>
    </div>
    <div class="pill cry" title="Kristal"><span class="gem" aria-hidden="true"></span><b id="hCrys">0</b></div>
    <button class="icon-btn" id="bSet" aria-label="Ayarlar"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg></button>
  </header>

  <main class="stage" id="stage">
    <canvas id="cv" aria-label="Maden kuyusu. Blokları kırmak için dokun."></canvas>
    <div class="region" aria-live="polite"><b id="rName">Başlangıç Madeni</b><div class="rbar"><i id="rBar"></i></div><small id="rTxt">0 / 100 m</small></div>
    <button class="boost" id="boost"><span class="bi">×2</span><span><b>Altın Rüzgarı</b><small id="boostTxt">45 sn</small></span></button>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div id="bannerHost"></div>
  </main>

  <section class="panel">
    <div class="phead">
      <div><h2 id="pTitle">Kazı Ekibi</h2><div class="ht" id="pHead"></div></div>
      <div class="seg" id="seg">
        <button data-mult="1" aria-pressed="true">×1</button>
        <button data-mult="10" aria-pressed="false">×10</button>
        <button data-mult="max" aria-pressed="false">Maks</button>
      </div>
    </div>
    <div class="list" id="list"></div>
  </section>

  <nav class="nav" role="tablist">
    <button role="tab" data-tab="ekip" aria-selected="true"><svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3"/><circle cx="16.5" cy="9" r="2.5"/><path d="M2.5 20c.5-4 3-6 5.5-6s5 2 5.5 6M14 14.5c3 0 6 1.5 6.5 5.5"/></svg>Kazı Ekibi<span class="dot" hidden></span></button>
    <button role="tab" data-tab="gel" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M12 20V5M5 11l7-7 7 7"/></svg>Geliştirme<span class="dot" hidden></span></button>
    <button role="tab" data-tab="yet" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M6 4h12l3 5-9 11L3 9z"/><path d="M3 9h18M9 4l3 16 3-16"/></svg>Yetenekler<span class="dot" hidden></span></button>
    <button role="tab" data-tab="kol" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>Koleksiyon<span class="dot" hidden></span></button>
  </nav>
</div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
(()=>{
'use strict';
/* ================= DATA ================= */
const COLS=5;
const BIOMES=[
  {name:'Başlangıç Madeni',from:0,to:100,blocks:['soil','hardsoil'],ores:[['coal',.07],['copper',.05]],
   back:'#3b2618',stone:'#4d3222',strata:['#8a5530','#9b6238','#7a4828','#a86d40'],deco:'roots',gauge:'#c98a4b',fog:'16,10,6'},
  {name:'Taşlık Bölge',from:100,to:250,blocks:['rock','hardrock'],ores:[['iron',.07],['silver',.045],['emerald',.014]],
   back:'#26252c',stone:'#36343d',strata:['#67646f','#75727e','#5a5762','#827e8a'],deco:'stal',gauge:'#9a97a6',fog:'10,10,14'},
  {name:'Demir Vadisi',from:250,to:Infinity,blocks:['ironrock','basalt'],ores:[['gold',.065],['ruby',.04],['diamond',.012],['crystal',.005]],
   back:'#2c1717',stone:'#3f2220',strata:['#7b4036','#8c4c40','#6a372f','#97584a'],deco:'veins',gauge:'#c0574a',fog:'14,6,6'},
];
const FUTURE=['Kristal Mağarası','Mantar Ormanı','Lav Denizi','Fosil Vadisi','Kayıp Şehir','Ejderha Hazinesi','Yeraltı Okyanusu','Zaman Koridoru','Dünyanın Ötesi'];
const BLOCKS={
  soil:{name:'Yumuşak Toprak',hp:1,gold:1,base:'#c07a42',dark:'#94582c',spk:'#d9975c',light:'#e0a56c'},
  hardsoil:{name:'Sert Toprak',hp:1.5,gold:1.5,base:'#9c5d31',dark:'#713f1e',spk:'#b5733f',light:'#c2834f'},
  rock:{name:'Kaya',hp:1,gold:1,base:'#94919c',dark:'#6b6875',spk:'#adaab4',light:'#bdbac4'},
  hardrock:{name:'Sert Kaya',hp:1.5,gold:1.5,base:'#73707c',dark:'#514e59',spk:'#8b8894',light:'#9996a2'},
  ironrock:{name:'Demirli Kaya',hp:1,gold:1,base:'#a35c4b',dark:'#7a3f33',spk:'#bd7462',light:'#c9806d'},
  basalt:{name:'Bazalt',hp:1.5,gold:1.5,base:'#5f5263',dark:'#423846',spk:'#776a7b',light:'#857888'},

function fmt(n){
  if(!isFinite(n)) return '∞';
  if(n<0) return '-'+fmt(-n);
  if(n<10 && n%1>0.05) return n.toFixed(1).replace('.',',');
  if(n<1e4) return Math.floor(n).toLocaleString('tr-TR');
  const e=Math.floor(Math.log10(n)/3);
  if(e>=SUF.length) return n.toExponential(2).replace('.',',');
  const v=n/Math.pow(10,3*e);
  return (v<10?v.toFixed(2):v<100?v.toFixed(1):Math.floor(v).toString()).replace('.',',')+' '+SUF[e];
}
const dec=v=>String(Math.round(v*10)/10).replace('.',',');

function hash(a,b,c){let h=(Math.imul(a|0,374761393)+Math.imul(b|0,668265263)+Math.imul(c|0,2246822519))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}

const rowCache=new Map();
function rowTypes(r){
  let a=rowCache.get(r); if(a) return a;
  const b=BIOMES[biomeIdx(r)]; a=[];
  const span=b.to===Infinity?300:b.to-b.from, t=Math.min(1,(r-b.from)/span);
  for(let c=0;c<COLS;c++){
    const u=hash(r,c,S.seed), u2=hash(r,c,S.seed+911);
    let type=null;
    if(r>2){
      const cp=.007*(has('sandik')?2:1);
      if(u<cp) type='chest';
      else{let acc=cp;const om=has('dedektor')?2:1;for(const [id,p] of b.ores){acc+=p*om;if(u<acc){type=id;break;}}}
    }
    if(!type) type=r===0?b.blocks[0]:(u2<.25+.45*t?b.blocks[1]:b.blocks[0]);
    a.push(type);
  }
  rowCache.set(r,a); if(rowCache.size>200) rowCache.delete(rowCache.keys().next().value);
  return a;
}
function makeFront(){
  const r=S.depth;
  S.row={r,cells:rowTypes(r).map(t=>{const max=hpAt(r)*BLOCKS[t].hp;return{t,hp:max,max};})};
}

function nearestAlive(col){
  const cs=S.row.cells; if(cs[col]) return col;
  for(let d=1;d<COLS;d++){if(col-d>=0&&cs[col-d])return col-d;if(col+d<COLS&&cs[col+d])return col+d;}
  return -1;
}

function tone(f,d,type,v,f2,delay){const a=ac();if(!a)return;const t=a.currentTime+(delay||0);const o=a.createOscillator(),gn=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(v||.2,t+.008);gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gn);gn.connect(master);o.start(t);o.stop(t+d+.03);}
function noise(d,v,freq,q,type,delay){const a=ac();if(!a)return;if(!noiseBuf){noiseBuf=a.createBuffer(1,a.sampleRate,a.sampleRate);const ch=noiseBuf.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;}
  const t=a.currentTime+(delay||0);const s=a.createBufferSource();s.buffer=noiseBuf;const f=a.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=freq;f.Q.value=q||1;const gn=a.createGain();gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(gn);gn.connect(master);s.start(t,Math.random()*.4);s.stop(t+d+.03);}

function paintBlock(c,type,host,variant,s){
  const T=BLOCKS[type],H0=BLOCKS[host]||T,R=rng(strSeed(type+host)+variant*977),m=s*.03,rad=s*.11;
  c.clearRect(0,0,s,s);
  rr(c,m,m,s-2*m,s-2*m,rad);c.fillStyle=H0.dark;c.fill();
  c.save();rr(c,m,m,s-2*m,s-2*m-s*.06,rad);c.clip();
  c.fillStyle=H0.base;c.fillRect(0,0,s,s);
  c.fillStyle=H0.light;c.fillRect(0,0,s,s*.1);

/* ================= GAMEPLAY ================= */
function addGold(v){S.gold+=v;S.stats.goldAll+=v;}
function hit(ci,dmg,src){
  const cell=S.row.cells[ci];if(!cell)return;
  cell.hp-=dmg;cell.shake=1;cell.flash=src==='tap'?1:.5;
  if(cell.hp<=0) breakBlock(ci);
}
function breakBlock(ci){
  const r=S.row.r,cell=S.row.cells[ci],T=BLOCKS[cell.t],{x,y}=blockCenter(ci);
  S.row.cells[ci]=null;S.stats.blocks++;
  const host=BLOCKS[hostFor(cell.t,r)];
  let goldV=hpAt(r)*T.gold*goldPerHp(r)*goldMult();
  if(T.chest){
    goldV=Math.max(goldRate()*30,hpAt(r)*goldPerHp(r)*goldMult()*25);S.stats.chests++;
    const cr=Math.random()<.35?1+Math.floor(Math.random()*3):0;
    if(cr){S.crystals+=cr;floatText(x,y-B*.5,`+${cr} kristal`,'#c9aaff',20,{max:1.4});}
    toast('Hazine sandığı!',`${fmt(goldV)} altın${cr?` ve ${cr} kristal`:''} buldun.`);SFX.chest();
    spawnParts(x,y,16,'#ffcb3d',{kind:'spark',up:1,g:200});
  }
  if(T.crystal){S.crystals+=1;floatText(x,y-B*.5,'+1 kristal','#c9aaff',20,{max:1.4});}
  if(T.mineral&&!S.found[cell.t]){S.found[cell.t]=1;toast('Yeni keşif!',`${T.name} koleksiyona eklendi.`,T.crystal);}
  addGold(goldV);
  floatText(x,y,'+'+fmt(goldV),'#ffd84a',T.ore||T.chest?24:19);
  spawnParts(x,y,8,host.base,{kind:'chunk',speed:1.1,size:1.6});
  spawnParts(x,y,8,host.dark,{speed:1});
  spawnParts(x,y+B*.2,5,'rgba(220,190,160,.45)',{kind:'smoke',speed:.35,g:-40,size:3,life:.8});
  parts.push({x,y,life:0,max:.3,k:'ring',c:'#fff',s:B*.5,vx:0,vy:0,g:0});
  if(T.ore) spawnParts(x,y,8,T.ore,{kind:'spark',up:1,size:1.3,g:500});
  const nc=Math.min(7,3+Math.round(Math.log10(1+(T.gold||1))*4));
  const sy=y-camY;
  for(let k=0;k<nc&&flies.length<40;k++) flies.push({x0:x,y0:sy,cx:x+(Math.random()-.5)*B*2,cy:sy-B*(1+Math.random()),t:-k*.04,dur:.55+Math.random()*.2});
  shake=Math.max(shake,1.8);
  SFX.brk();SFX.coin();
  if(S.row.cells.every(c=>!c)) advance();
}
function advance(){
  S.depth++;S.runMax=Math.max(S.runMax,S.depth);
  const was=S.stats.bestDepth;S.stats.bestDepth=Math.max(S.stats.bestDepth,S.depth);
  const b=BIOMES[biomeIdx(S.depth)];
  if(S.depth===b.from&&S.depth>0){banner(was<S.depth?'Yeni bölge':'Bölge',b.name);SFX.region();}
  makeFront();
}
function tapAt(px){
  const ci=nearestAlive(clamp(Math.floor((px-SX)/B),0,COLS-1));if(ci<0)return;
  const t=time;combo.n=t-combo.last<.7?combo.n+1:1;combo.last=t;combo.show=1;
  let d=tapDmg()*(1+Math.min(combo.n,50)*.01),crit=Math.random()<critChance();
  if(crit){d*=critMult();S.stats.crits++;shake=Math.max(shake,5);}
  S.stats.taps++;
  player.col=ci;player.st=0;
  const {x,y}=blockCenter(ci),bx=x+(Math.random()-.5)*B*.4,by=y+(Math.random()-.5)*B*.3;
  swings.push({x:bx,y:by,t:0,crit});
  const host=BLOCKS[hostFor(S.row.cells[ci].t,S.row.r)];
  spawnParts(bx,by-B*.2,6,host.spk,{up:1,speed:.9,kind:'chunk',size:.9});
  floatText(bx,by-B*.25,(crit?'KRİTİK ':'')+fmt(d),crit?'#ff7a2b':'#ffffff',crit?28:21);
  crit?SFX.crit():SFX.tap();

}
function workerHit(sp,ci){
  const w=WORKERS[sp.i],n=dispCount(S.own[sp.i]);if(!n)return;
  const dmg=workerDps(sp.i)/n*w.period,u=B*w.scale;
  if(w.area){projs.push({sx:sp.x+sp.facing*u*.3,sy:sp.y-u*.8,tx:colX(ci),ty:(S.row.r+.4)*B,t:0,dur:.45,dmg});return;}
  const {x}=blockCenter(ci),top=S.row.r*B;

  spawnParts(x+(Math.random()-.5)*B*.5,top+B*.1,w.draw==='exc'?9:4,host.spk,{up:1,speed:.75,kind:'chunk',size:.8});
  if(w.draw==='exc') shake=Math.max(shake,2.5);
  if(floats.length<12&&dmg>=1) floatText(x+(Math.random()-.5)*B*.5,top+B*.25,fmt(dmg),'rgba(255,245,230,.8)',14,{max:.7,vy:40});

function explode(pj){
  const row=S.row,al=aliveIdx();
  spawnParts(pj.tx,pj.ty,20,'#ffb13a',{kind:'spark',speed:1.5,g:150});
  spawnParts(pj.tx,pj.ty,10,'rgba(90,80,75,.8)',{kind:'smoke',speed:.6,g:-60,size:3,life:1});
  parts.push({x:pj.tx,y:pj.ty,life:0,max:.35,k:'ring',c:'#ffd27a',s:B*1.4,vx:0,vy:0,g:0});
  shake=Math.max(shake,7);SFX.boom();
  if(!al.length)return;
  const each=pj.dmg/Math.sqrt(al.length);
  for(const ci of al){if(S.row!==row)break;if(row.cells[ci])hit(ci,each,'w');}

/* ================= UPDATE ================= */
function update(dt){
  time+=dt;
  camY=lerp(camY,S.depth*B-frontY(),1-Math.pow(.0015,dt));
  shake*=Math.pow(.02,dt);
  combo.show=Math.max(0,combo.show-dt*.6);if(time-combo.last>1.2)combo.n=0;
  for(const c of S.row.cells) if(c){c.shake=(c.shake||0)*Math.pow(.0008,dt);c.flash=(c.flash||0)*Math.pow(.0005,dt);}
  // player: snaps to the column of the last tap, then idles
  const pc=nearestAlive(player.col);if(pc>=0)player.col=pc;
  const ptx=colX(player.col);if(!player.x)player.x=ptx;
  const pdx=ptx-player.x;player.x+=clamp(pdx,-B*14*dt,B*14*dt);if(Math.abs(pdx)>2)player.facing=pdx>0?1:-1;
  player.st+=dt;
  for(const sp of sprites){
    const w=WORKERS[sp.i],ci=nearestAlive(sp.home);
    if(ci>=0){
      const tx=SX+(ci+.5+sp.off)*B,dx=tx-sp.x,v=B*3.2*dt;
      if(Math.abs(dx)>1){sp.x+=clamp(dx,-v,v);sp.facing=dx>0?1:-1;sp.walk+=dt*16;}else sp.walk=0;
    }
    const col=clamp(Math.floor((sp.x-SX)/B),0,COLS-1),ground=(S.row.cells[col]?S.row.r:S.row.r+1)*B;
    if(sp.y<ground-.5){sp.vy+=1800*dt;sp.y=Math.min(ground,sp.y+sp.vy*dt);if(sp.y>=ground){if(sp.vy>400)spawnParts(sp.x,ground,6,'rgba(220,190,160,.6)',{kind:'smoke',speed:.4,g:-30,size:2});sp.vy=0;}}
    else if(sp.y>ground){sp.y=Math.max(ground,sp.y-B*4*dt);sp.vy=0;}
    sp.t+=dt;
    if(sp.t>=w.period){sp.t-=w.period;if(ci>=0&&S.row.cells[ci])workerHit(sp,ci);}
  }
  for(let k=projs.length-1;k>=0;k--){const pj=projs[k];pj.t+=dt;if(pj.t>=pj.dur){projs.splice(k,1);explode(pj);}}
  for(let k=parts.length-1;k>=0;k--){const p=parts[k];p.life+=dt;if(p.life>=p.max){parts.splice(k,1);continue;}p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.3,dt);p.rot+=(p.vr||0)*dt;}
  for(let k=floats.length-1;k>=0;k--){const f=floats[k];f.life+=dt;f.y+=f.vy*dt;f.vy*=Math.pow(.25,dt);if(f.life>=f.max)floats.splice(k,1);}
  for(let k=swings.length-1;k>=0;k--){swings[k].t+=dt;if(swings[k].t>.25)swings.splice(k,1);}
  for(let k=flies.length-1;k>=0;k--){const f=flies[k];f.t+=dt;if(f.t>=f.dur){flies.splice(k,1);bumpHud();}}
  if(Math.random()<dt*4){const ci=Math.floor(Math.random()*COLS),c=S.row.cells[ci];if(c&&(BLOCKS[c.t].gem||BLOCKS[c.t].chest||BLOCKS[c.t].ore)){spawnParts(SX+(ci+.2+Math.random()*.6)*B,(S.row.r+.2+Math.random()*.6)*B,1,'#fff',{kind:'spark',speed:.05,g:0,life:.6});}}
  if(boostOn()&&Math.random()<dt*10) spawnParts(Math.random()*W,camY+Math.random()*H*.6,1,'#ffd84a',{kind:'spark',speed:.1,g:-40,life:1});
  S.last=now();
}

function crackLines(cell,ci){
  if(cell.cr) return cell.cr;
  const R=rng(strSeed('c'+S.row.r+'_'+ci)+S.seed),lines=[];
  for(let k=0;k<6;k++){let x=.5+(R()-.5)*.2,y=.5+(R()-.5)*.2,a=R()*Math.PI*2;const pts=[[x,y]];for(let j=0;j<4;j++){a+=(R()-.5)*1.2;x+=Math.cos(a)*.11;y+=Math.sin(a)*.11;pts.push([clamp(x,.06,.94),clamp(y,.06,.9)]);}lines.push(pts);}
  cell.cr=lines;return lines;
}

  g.fillStyle='#8fd481';g.beginPath();g.moveTo(-10,gy);for(let x=0;x<=W+10;x+=W/10)g.lineTo(x,gy-B*(.7+.35*Math.sin(x*.012+1)));g.lineTo(W+10,gy);g.fill();

  $('pTitle').textContent=TITLES[tab];
  $('seg').hidden=tab!=='ekip';
  document.querySelectorAll('#seg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mult===String(S.buyMult))));
  const head=$('pHead');let hh;
  if(tab==='ekip') hh=`Toplam <b>${fmt(teamDps())}/sn</b> hasar`;
  else if(tab==='gel') hh=`Dokunuş <b>${fmt(tapDmg())}</b> · Kritik <b>%${Math.round(critChance()*100)}</b> ×${dec(critMult())}`;
  else if(tab==='yet') hh=`<b style="color:var(--crystal)">${fmt(S.crystals)}</b> kristal · seferler arası kalır`;
  else hh=`Maden <b>${MINERALS.filter(m=>S.found[m]).length}/${MINERALS.length}</b> · Başarım <b>${achCount()}/${ACH.length}</b> (her biri +%3 altın)`;
  if(head.innerHTML!==hh)head.innerHTML=hh;
  if(tab==='kol'){
    const h=collectionHTML();if(h!==colHTML||listKey!=='kol'){listEl.innerHTML=h;colHTML=h;listKey='kol';}
    curItems=new Map();
  }else{
    const items=buildItems(tab),key=tab+':'+items.map(i=>i.key+(i.locked?'L':'')).join(',');
    if(key!==listKey){listEl.innerHTML=items.map(itemHTML).join('');listKey=key;colHTML='';}
    curItems=new Map(items.map(i=>[i.key,i]));
    for(const it of items){
      const el=listEl.querySelector(`[data-i="${it.key}"]`);if(!el)continue;
      const set=(f,v)=>{const n=el.querySelector(`[data-f="${f}"]`);if(!n)return;v=v||'';if(n.textContent!==v)n.textContent=v;n.hidden=!v;};
      set('t',it.t);set('g',it.g);set('m',it.m);set('e',it.em);set('d',it.d);
      const pb=el.querySelector('[data-f="p"]');pb.hidden=it.bar==null;if(it.bar!=null)pb.firstChild.style.width=(it.bar*100).toFixed(0)+'%';
      if(!it.nobtn){set('b',it.b);set('c',it.c);el.querySelector('button').disabled=!it.can;}
      el.classList.toggle('pulse',!!it.pulse);
    }
  }
  const dots={ekip:buildItems('ekip').some(i=>i.can),gel:buildItems('gel').some(i=>i.can),yet:buildItems('yet').some(i=>i.can),kol:false};
  document.querySelectorAll('.nav button').forEach(b=>{b.querySelector('.dot').hidden=!dots[b.dataset.tab]||b.dataset.tab===tab;});
}
function collectionHTML(){
  const best=S.stats.bestDepth;
  let h='<div class="col">';
  h+=`<h3>Kazı Ekibi <span>${WORKERS.filter((w,i)=>S.found['w'+i]).length}/${WORKERS.length}</span></h3><div class="tiles">`;
  WORKERS.forEach((w,i)=>{const on=S.found['w'+i];h+=`<div class="tile ${on?'on':'off'}"><img alt="" src="${portrait(i)}">${on?w.name:'???'}</div>`;});
  h+=`</div><p class="note">Sonraki güncellemelerde 20 ekip daha: hayvanlar, makineler ve fantastik ekipler.</p>`;
  h+=`<h3>Bölgeler <span>${BIOMES.filter(b=>best>=b.from).length}/${BIOMES.length+FUTURE.length}</span></h3><div class="regions">`;
  BIOMES.forEach(b=>{const on=best>=b.from;h+=`<div class="reg ${on?'':'off'}"><b>${on?b.name:'???'}</b><span>${b.from}–${b.to===Infinity?'…':b.to} m</span></div>`;});
  FUTURE.slice(0,3).forEach(n=>{h+=`<div class="reg off"><b>${n}</b><span>Yakında</span></div>`;});
  h+=`</div><h3>Madenler <span>${MINERALS.filter(m=>S.found[m]).length}/${MINERALS.length}</span></h3><div class="tiles">`;
  MINERALS.forEach(m=>{const on=S.found[m];h+=`<div class="tile ${on?'on':'off'}"><img alt="" src="${thumb(m)}">${on?BLOCKS[m].name:'???'}</div>`;});
  h+=`</div><h3>Başarımlar <span>${achCount()}/${ACH.length}</span></h3><div class="achs">`;
  ACH.forEach(a=>{const on=S.ach[a.id];h+=`<div class="ach ${on?'on':''}"><i>${on?'✓':''}</i><div><b>${a.name}</b><small>${a.desc}</small></div></div>`;});
  h+=`</div><h3>İstatistikler</h3><div class="stats">
    <div>En derin<b>${best.toLocaleString('tr-TR')} m</b></div><div>Kırılan blok<b>${S.stats.blocks.toLocaleString('tr-TR')}</b></div>
    <div>Dokunuş<b>${S.stats.taps.toLocaleString('tr-TR')}</b></div><div>Toplam altın<b>${fmt(S.stats.goldAll)}</b></div>
    <div>Açılan sandık<b>${S.stats.chests}</b></div><div>Tamamlanan sefer<b>${S.stats.runs}</b></div></div></div>`;
  return h;
}
function checkAch(){
  WORKERS.forEach((w,i)=>{if(S.own[i]>0)S.found['w'+i]=1;});
  for(const a of ACH){if(!S.ach[a.id]&&a.t()){S.ach[a.id]=1;toast('Başarım: '+a.name,a.desc+' · altın +%3');SFX.ach();}}
}

/* --- modals --- */
const modal=$('modal'),sheet=$('sheet');let modalActs={};
function openModal(html,acts){sheet.innerHTML=html;modalActs=acts||{};modal.hidden=false;const b=sheet.querySelector('.buy,button');if(b)b.focus();}
function closeModal(){modal.hidden=true;modalActs={};}
sheet.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;SFX.ui();const f=modalActs[b.dataset.act];if(f)f(b);else closeModal();});
modal.addEventListener('click',e=>{if(e.target===modal&&!modalActs.__lock)closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden&&!modalActs.__lock)closeModal();});
function openPrestige(){
  const n=crystalsFor();
  openModal(`<h2>Yeni Sefer</h2><p>Bu kazıyı burada bitirip yüzeye çıkarsan kalıcı kristaller kazanırsın. Kristallerle Yetenekler sekmesinden kalıcı güçler öğrenirsin.</p>
    <div class="gain c"><span class="gem lg"></span>+${fmt(n)} kristal</div>
    <ul><li><b>Sıfırlanır:</b> derinlik (${S.runMax} m), altın, kazı ekibi, geliştirmeler</li><li><b>Kalır:</b> kristaller, yetenekler, başarımlar, koleksiyon</li>
    ${tal('sermaye')?`<li><b>Başlangıç:</b> ${fmt(startGold())} altın</li>`:''}</ul>
    <div class="acts"><button class="ghost" data-act="close">Vazgeç</button><button class="buy cry" data-act="go">Sefere çık</button></div>`,
    {go:()=>{doPrestige(n);closeModal();}});
}
function resetWorld(){rowCache.clear();makeFront();sprites=[];parts=[];floats=[];projs=[];flies=[];camY=-frontY();player.col=2;player.x=colX(2);listKey='';}
function doPrestige(n){
  const keep={crystals:S.crystals+n,tal:S.tal,ach:S.ach,found:S.found,stats:S.stats,sound:S.sound,buyMult:S.buyMult};
  S=Object.assign(fresh(),keep);S.stats.runs++;S.gold=startGold();
  resetWorld();banner(`Sefer ${S.stats.runs+1}`,'Yeniden aşağı!');SFX.region();S.tab='yet';save();
}
function openSettings(step){
  openModal(`<h2>Ayarlar</h2>
    <div class="setrow"><span>Ses efektleri</span><button class="ghost" data-act="snd">${S.sound?'Açık':'Kapalı'}</button></div>
    <div class="setrow"><span style="color:var(--muted)">Oyun kendini her 5 saniyede bu tarayıcıya kaydeder.</span></div>
    <div class="setrow"><span>${step?'Bütün ilerleme, kristaller ve yetenekler silinir. Emin misin?':'Bütün ilerlemeyi sil'}</span>
      <button class="ghost danger" data-act="${step?'wipe':'reset'}">${step?'Evet, sil':'Sıfırla'}</button></div>
    <div class="acts" style="margin-top:12px"><button class="buy" data-act="close">Tamam</button></div>`,
    {snd:()=>{S.sound=!S.sound;openSettings(step);},reset:()=>openSettings(true),
     wipe:()=>{try{localStorage.removeItem(SAVE_KEY);}catch(e){}S=fresh();resetWorld();closeModal();save();}});
}
function grantAway(sec,showModal){
  const cap=offlineCap(),eff=offlineEff(),t=Math.min(sec,cap),rate=goldRate(true);
  if(rate<=0||t<5) return;
  const v=rate*t*eff;
  if(!showModal||t<60){addGold(v);return;}
  openModal(`<h2>Tekrar hoş geldin!</h2><p>Sen yokken ekibin ${dur(t)} boyunca kazmaya devam etti${sec>cap?` (sınır ${dur(cap)})`:''}.</p>
    <div class="gain"><span class="coin"></span>+${fmt(v)}</div><p>Çevrimdışı verim %${Math.round(eff*100)}. Gece Vardiyası ve Uyumayan Maden bunu artırır.</p>
    <div class="acts"><button class="buy" data-act="ok">Topla</button></div>`,{__lock:1,ok:()=>{addGold(v);SFX.coin();closeModal();}});
}

/* ================= INPUT ================= */
cv.addEventListener('pointerdown',e=>{e.preventDefault();const r=cv.getBoundingClientRect();tapAt(e.clientX-r.left);});
listEl.addEventListener('click',e=>{
  const b=e.target.closest('button[data-k]');if(!b||b.disabled)return;
  const it=curItems.get(b.dataset.k);if(!it||!it.act)return;
  if(it.act()){SFX.buy();checkAch();}
  renderPanel();updateHud();
});
document.querySelector('.nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;SFX.ui();listEl.scrollTop=0;renderPanel();});
$('seg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.buyMult=b.dataset.mult==='max'?'max':+b.dataset.mult;SFX.ui();renderPanel();});
$('boost').addEventListener('click',()=>{const n=now();if(n<S.boostReady)return;S.boostEnd=n+45000;S.boostReady=n+45000+240000;banner('Altın Rüzgarı','45 sn ×2');SFX.region();updateHud();});
$('bSet').addEventListener('click',()=>openSettings(false));
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){save();}
  else{const away=(now()-S.last)/1000;if(away>5)grantAway(away,true);S.last=now();}
});
window.addEventListener('pagehide',save);

/* ================= BOOT ================= */
let lastT=0,uiAcc=0,saveAcc=0;
function frame(ts){
  const dt=Math.min(.1,lastT?(ts-lastT)/1000:0);lastT=ts;
  update(dt);render();
  uiAcc+=dt;saveAcc+=dt;
  if(uiAcc>.2){uiAcc=0;updateHud();renderPanel();checkAch();}
  if(saveAcc>5){saveAcc=0;save();}
  requestAnimationFrame(frame);
}
function start(data){
  S=(data&&data.state)?Object.assign(fresh(),data.state):(load()||fresh());
  const away=(now()-S.last)/1000;
  if(!S.row||S.row.r!==S.depth||S.row.cells.length!==COLS)makeFront();
  resize();camY=S.depth*B-frontY();player.x=colX(player.col);
  syncSprites();sprites.forEach(s=>{s.y=S.row.r*B;});
  new ResizeObserver(()=>{resize();player.x=colX(player.col);}).observe(stage);
  window.claude?.hot?.snapshot?.(()=>({state:serial()}));
  updateHud();renderPanel();
  if(!(data&&data.state)&&away>5)grantAway(away,true);
  S.last=now();
  requestAnimationFrame(frame);
}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
