<title>Kazdıkça</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: compact resource HUD (~10%) · big mine-shaft canvas (~48%) · crew/upgrade panel (~35%) · bottom nav (~7%).
   Wide screens: shaft on the left, panel + nav on the right. Single deliberate dark-anthracite theme;
   warm earth colours live only inside the game world. */
:root{
  --bg:#14161b;
  --surface:#1d2027;
  --surface-2:#262a33;
  --surface-3:#30353f;
  --text:#f3f4f7;
  --muted:#9aa1ad;
  --gold:#ffcb3d;
  --accent:#ff8a2b;
  --accent-deep:#c25a12;
  --crystal:#a979ff;
  --crystal-deep:#6c3fd1;
  --good:#5fd38d;
  --danger:#ff6b5e;
  --display:"Fredoka","Trebuchet MS","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-weight:700;overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{box-sizing:border-box;height:100%;max-width:1180px;margin:0 auto;display:grid;
  grid-template-rows:auto minmax(0,1fr) minmax(0,31%) auto;gap:6px;
  grid-template-areas:"hud" "stage" "panel" "nav";
  padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud{grid-area:hud}.stage{grid-area:stage}.panel{grid-area:panel}.nav{grid-area:nav}
@media (min-width:880px){
  #app{grid-template-columns:minmax(0,1fr) 410px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:12px;
    grid-template-areas:"hud hud" "stage panel" "stage nav"}
}

/* HUD: one compact band */
.hud{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,.75fr) auto;gap:6px;align-items:center;min-width:0}
.pill{display:flex;align-items:center;gap:7px;background:var(--surface);border-radius:999px;padding:4px 10px 4px 5px;min-width:0;height:38px;box-sizing:border-box}
.pill b{font-family:var(--display);font-weight:700;font-size:1.15rem;line-height:1;letter-spacing:.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill small{display:block;font-size:.64rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.1}
.pill .stack{min-width:0;overflow:hidden}
.pill.gold b{color:var(--gold)}
.pill.depth,.pill.cry{justify-content:center;padding-left:8px}
.pill.depth svg{width:15px;height:15px;flex:none;stroke:var(--accent);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.pill.cry b{color:var(--crystal)}
.pill.bump{animation:bump .22s ease-out}
@keyframes bump{40%{transform:scale(1.07)}}
.icon-btn{flex:none;width:38px;height:38px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:var(--text);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.coin{display:inline-block;width:28px;height:28px;flex:none;border-radius:50%;background:var(--gold);
  box-shadow:inset 0 -3px 0 #d99a12,inset 0 0 0 2px #b37808;position:relative}
.coin::after{content:"";position:absolute;left:28%;top:22%;width:26%;height:26%;border-radius:50%;background:#fff3c2}
.coin.sm{width:14px;height:14px;box-shadow:inset 0 -1.5px 0 #d99a12,inset 0 0 0 1.5px #b37808}
.gem{display:inline-block;width:16px;height:18px;flex:none;background:var(--crystal);clip-path:polygon(50% 0,100% 36%,50% 100%,0 36%);position:relative}
.gem::after{content:"";position:absolute;inset:0;background:#e2d2ff;clip-path:polygon(50% 0,100% 36%,50% 50%)}
.gem.sm{width:12px;height:14px}
.gem.lg{width:22px;height:26px}

/* Stage */
.stage{position:relative;border-radius:22px;overflow:hidden;background:#0c0b0e;min-height:0;touch-action:none}
#cv{display:block;width:100%;height:100%;touch-action:none;cursor:pointer}
.region{position:absolute;left:8px;top:8px;background:rgba(14,15,20,.72);border-radius:11px;padding:4px 9px 5px;max-width:64%;pointer-events:none}
.region .rl{display:flex;align-items:baseline;column-gap:6px;flex-wrap:wrap}
.region b{font-family:var(--display);font-weight:700;font-size:.8rem;letter-spacing:.02em}
.region small{font-size:.66rem;color:var(--muted);font-variant-numeric:tabular-nums}
.rbar{height:3px;border-radius:3px;background:rgba(255,255,255,.14);margin-top:4px;overflow:hidden}
.rbar i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .3s}
.buff{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:0}
.ring{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--rc,var(--gold)) calc(var(--p,1)*360deg),rgba(255,255,255,.14) 0)}
.ring span{width:32px;height:32px;border-radius:50%;background:#3a2604;color:var(--gold);display:grid;place-items:center;font-family:var(--display);font-size:.9rem}
.buff small{font-size:.6rem;font-weight:900;background:rgba(14,15,20,.78);border-radius:999px;padding:1px 6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.buff.ready .ring{animation:glow .9s ease-in-out infinite alternate}
.buff:disabled{cursor:default}
.buff.cool .ring span{background:#22252c;color:var(--muted)}
@keyframes glow{to{box-shadow:0 0 0 3px rgba(255,203,61,.3),0 0 16px 4px rgba(255,203,61,.45)}}
.toasts{position:absolute;left:10px;right:10px;bottom:40px;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
.toast{max-width:100%;background:rgba(14,15,20,.88);border-radius:999px;padding:4px 12px;font-size:.7rem;text-align:center;animation:tin .25s ease-out;color:var(--muted)}
.toast b{font-family:var(--display);font-weight:700;font-size:.82rem;color:var(--gold);letter-spacing:.02em;margin-right:6px}
.toast.cr b{color:var(--crystal)}
.toast.out{opacity:0;transform:translateY(-6px);transition:.3s}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
.banner{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;
  animation:ban 2.6s ease-in-out forwards;width:max-content;max-width:90%}
.banner em{display:block;font-style:normal;font-size:.78rem;font-weight:800;color:#fff;margin-top:6px;text-shadow:0 2px 0 #000;max-width:300px;margin-inline:auto;text-wrap:balance}
.banner small{display:block;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:#fff;text-shadow:0 2px 0 #000}
.banner b{display:block;font-family:var(--display);font-weight:700;font-size:clamp(1.9rem,7vw,2.8rem);color:var(--gold);
  text-shadow:0 3px 0 #6b3a00,0 0 26px rgba(0,0,0,.85);text-wrap:balance}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-30%) scale(.85)}12%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%)}}

/* Panel */
.panel{background:var(--surface);border-radius:22px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.phead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px 5px 12px;flex-wrap:wrap}
.phead h2{margin:0;font-family:var(--display);font-weight:700;font-size:1rem;letter-spacing:.02em;line-height:1}
.phead .ht{font-size:.7rem;color:var(--muted);margin-top:2px}
.phead .ht b{color:var(--text);font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--bg);border-radius:999px;padding:3px;gap:2px}
.seg button{border-radius:999px;padding:4px 10px;font-size:.74rem;font-weight:900;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--text)}
.list{overflow-y:auto;padding:2px 6px 8px;display:flex;flex-direction:column;gap:5px;min-height:0;overscroll-behavior:contain}
.item{display:grid;grid-template-columns:50px minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--surface-2);border-radius:14px;padding:5px 7px 5px 5px;box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .2s}
.item.locked{opacity:.55}
.item.pulse{box-shadow:inset 0 0 0 2px var(--accent);animation:pul .9s ease-in-out infinite alternate}
@keyframes pul{to{box-shadow:inset 0 0 0 2px var(--accent),0 0 0 4px rgba(255,138,43,.18)}}
.item.pr{background:#2c2440}
.ic{width:50px;height:50px;border-radius:12px;background:var(--tint,var(--surface-3));display:grid;place-items:center;overflow:hidden}
.ic img{width:50px;height:50px;display:block}
.ic.sil img{filter:brightness(0) opacity(.5)}
.ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ic.c-gold{color:var(--gold)}.ic.c-cry{color:var(--crystal)}.ic.c-red{color:var(--danger)}.ic.c-grn{color:var(--good)}.ic.c-acc{color:var(--accent)}
.tx{min-width:0}
.tx .t{display:flex;align-items:center;gap:6px;min-width:0}
.tx .t span:first-child{font-family:var(--display);font-weight:700;font-size:.95rem;letter-spacing:.01em;line-height:1.1;overflow-wrap:anywhere}
.tag{flex:none;font-size:.6rem;font-weight:900;background:var(--surface-3);color:var(--text);border-radius:999px;padding:1px 6px;font-variant-numeric:tabular-nums}
.tx .m{font-size:.82rem;color:var(--gold);margin-top:1px;font-weight:900;font-variant-numeric:tabular-nums}
.tx .m em{font-style:normal;color:var(--good);font-weight:800}
.item.pr .tx .m,.item.tal .tx .m{color:var(--crystal)}
.tx .d{font-size:.67rem;color:var(--muted);margin-top:1px;line-height:1.25}
.pb{height:3px;border-radius:3px;background:var(--surface-3);margin-top:3px;overflow:hidden;max-width:150px}
.pb i{display:block;height:100%;background:var(--accent);border-radius:3px}
.buy{border-radius:12px;background:var(--accent);color:#fff;box-shadow:0 3px 0 var(--accent-deep);padding:5px 8px 6px;min-width:76px;
  display:flex;flex-direction:column;align-items:center;gap:1px}
.buy:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--accent-deep)}
.buy .bl{font-size:.6rem;font-weight:900;text-transform:uppercase;letter-spacing:.06em;opacity:.95}
.buy .bc{display:flex;align-items:center;gap:4px;font-family:var(--display);font-size:.92rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.buy.cry{background:var(--crystal);box-shadow:0 3px 0 var(--crystal-deep)}
.buy:disabled{background:var(--surface-3);color:var(--muted);box-shadow:0 3px 0 #1a1d23;cursor:default}
.buy:disabled .coin,.buy:disabled .gem{filter:saturate(.3) brightness(.75)}

/* Bottom nav */
.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--surface);border-radius:18px;padding:4px}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;border-radius:14px;padding:4px 1px 3px;color:var(--muted);font-size:.6rem;font-weight:900;white-space:nowrap}
.nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-selected="true"]{background:var(--surface-3);color:var(--accent)}
.nav .dot{position:absolute;top:5px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 2px var(--surface)}

/* Collection */
.tag.cnt{background:rgba(255,138,43,.2);color:#ffb27a}
.rew{font-size:.7rem;color:var(--muted);margin:-2px 4px 6px}
.rew.ok{color:var(--good)}
.reg small{display:block;color:var(--muted);font-size:.66rem;font-weight:700;margin-top:1px}
.tile svg{width:30px;height:30px;display:block;margin:9px auto 13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile.off svg{opacity:.25}
.tile.btn{cursor:pointer;border:2px solid transparent}
.tile.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--text)}
.tile.btn:disabled{cursor:default}
.col h3{font-family:var(--display);font-weight:700;font-size:1rem;margin:8px 4px 6px;display:flex;justify-content:space-between;letter-spacing:.02em}
.col h3 span{font-family:var(--body);font-size:.76rem;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px}
.tile{background:var(--surface-2);border-radius:12px;padding:6px 4px;text-align:center;font-size:.68rem;color:var(--muted);line-height:1.2}
.tile img{width:48px;height:48px;display:block;margin:0 auto 4px;border-radius:8px}
.tile.off img{filter:brightness(0) opacity(.45)}
.tile.on{color:var(--text)}
.regions,.achs{display:flex;flex-direction:column;gap:4px}
.reg{display:flex;justify-content:space-between;gap:8px;background:var(--surface-2);border-radius:10px;padding:7px 10px;font-size:.78rem}
.reg span{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.reg.off{opacity:.5}
.ach{display:flex;gap:10px;align-items:center;background:var(--surface-2);border-radius:10px;padding:7px 10px;font-size:.78rem}
.ach i{width:20px;height:20px;border-radius:50%;background:var(--surface-3);flex:none;display:grid;place-items:center;font-style:normal;font-size:.7rem}
.ach.on i{background:var(--good);color:#10301d}
.ach div{min-width:0}
.ach small{display:block;color:var(--muted)}
.note{font-size:.72rem;color:var(--muted);margin:6px 4px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.stats div{background:var(--surface-2);border-radius:10px;padding:6px 10px;font-size:.72rem;color:var(--muted)}
.stats b{display:block;color:var(--text);font-size:.9rem;font-variant-numeric:tabular-nums}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(6,7,10,.74);display:grid;place-items:center;z-index:20;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{background:var(--surface);border-radius:24px;padding:20px;width:min(400px,100%);box-sizing:border-box;animation:tin .2s ease-out;max-height:88vh;overflow:auto}
.sheet h2{font-family:var(--display);font-weight:700;font-size:1.7rem;margin:0 0 6px;color:var(--gold);letter-spacing:.02em;text-wrap:balance}
.sheet p{color:var(--muted);font-size:.88rem;line-height:1.45;margin:0 0 12px}
.sheet .gain{font-family:var(--display);font-size:2.2rem;display:flex;align-items:center;gap:10px;margin:6px 0 12px;color:var(--gold)}
.sheet .gain.c{color:var(--crystal)}
.sheet ul{margin:0 0 14px;padding-left:18px;font-size:.84rem;line-height:1.6}
.sheet .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.sheet .buy{min-width:120px;padding:9px 16px;font-family:var(--display);font-size:1.05rem}
.ghost{background:var(--surface-2);border-radius:12px;padding:9px 14px;font-weight:800}
.ghost.danger{color:var(--danger)}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;gap:10px;font-size:.88rem}
.setrow+.setrow{border-top:1px solid var(--surface-3)}
@media (max-width:420px){
  .pill{padding-right:8px;gap:5px}
  .pill b{font-size:1.02rem}
  .coin{width:24px;height:24px}
  .item{grid-template-columns:46px minmax(0,1fr) auto;gap:7px}
  .ic,.ic img{width:46px;height:46px}
  .buy{min-width:72px;padding-inline:7px}
}
@media (max-width:360px){.pill.gold small{display:none}.pill.depth svg{display:none}}
@media (prefers-reduced-motion:reduce){
  .banner,.toast,.item.pulse,.buff.ready .ring,.sheet,.pill.bump{animation:none}
}
</style>

<div id="app">
  <header class="hud">
    <div class="pill gold" id="pGold" title="Altın">
      <span class="coin" aria-hidden="true"></span>
      <div class="stack"><b id="hGold">0</b><small id="hRate">+0/sn</small></div>
    </div>
    <div class="pill depth" title="Derinlik">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v15M6 13l6 6 6-6"/></svg>
      <b id="hDepth">0 m</b>
    </div>
    <div class="pill cry" title="Kristal"><span class="gem" aria-hidden="true"></span><b id="hCrys">0</b></div>
    <button class="icon-btn" id="bSet" aria-label="Ayarlar"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg></button>
  </header>

  <main class="stage" id="stage">
    <canvas id="cv" aria-label="Maden kuyusu. Blokları kırmak için dokun."></canvas>
    <div class="region" aria-live="polite"><div class="rl"><b id="rName">Başlangıç Madeni</b><small id="rTxt">Taşlık Bölge’ye 100 m</small></div><div class="rbar"><i id="rBar"></i></div></div>
    <button class="buff ready" id="boost" aria-label="Altın Rüzgarı: 45 saniye hasar ve altın ×2"><span class="ring" id="boostRing"><span>×2</span></span><small id="boostTxt">Hazır</small></button>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div id="bannerHost"></div>
  </main>

  <section class="panel">
    <div class="phead">
      <div><h2 id="pTitle">Kazı Ekibi</h2><div class="ht" id="pHead"></div></div>
      <div class="seg" id="seg">
        <button data-mult="1" aria-pressed="true">×1</button>
        <button data-mult="10" aria-pressed="false">×10</button>
        <button data-mult="max" aria-pressed="false">Maks</button>
      </div>
    </div>
    <div class="list" id="list"></div>
  </section>

  <nav class="nav" role="tablist">
    <button role="tab" data-tab="ekip" aria-selected="true"><svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3"/><circle cx="16.5" cy="9" r="2.5"/><path d="M2.5 20c.5-4 3-6 5.5-6s5 2 5.5 6M14 14.5c3 0 6 1.5 6.5 5.5"/></svg>Ekip<span class="dot" hidden></span></button>
    <button role="tab" data-tab="gel" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M12 20V5M5 11l7-7 7 7"/></svg>Geliştir<span class="dot" hidden></span></button>
    <button role="tab" data-tab="yet" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M6 4h12l3 5-9 11L3 9z"/><path d="M3 9h18M9 4l3 16 3-16"/></svg>Yetenek<span class="dot" hidden></span></button>
    <button role="tab" data-tab="gor" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4M9 15l2 2 4-4"/></svg>Görevler<span class="dot" hidden></span></button>
    <button role="tab" data-tab="kol" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>Koleksiyon<span class="dot" hidden></span></button>
  </nav>
</div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
(()=>{
'use strict';
/* ================= DATA ================= */
const COLS=5;
const BIOMES=[
  {name:'Başlangıç Madeni',mech:'Kömür ve bakır damarları',from:0,to:100,blocks:['soil','hardsoil'],ores:[['coal',.07],['copper',.05]],
   back:'#3b2618',stone:'#4d3222',strata:['#8a5530','#9b6238','#7a4828','#a86d40'],deco:'roots',gauge:'#c98a4b',fog:'16,10,6'},
  {name:'Taşlık Bölge',mech:'Demir, gümüş ve nadir zümrüt',dat:'Taşlık Bölge’ye',from:100,to:250,blocks:['rock','hardrock'],ores:[['iron',.07],['silver',.045],['emerald',.014]],
   back:'#26252c',stone:'#36343d',strata:['#67646f','#75727e','#5a5762','#827e8a'],deco:'stal',gauge:'#9a97a6',fog:'10,10,14'},

// one character per hire up to 6, then one more per 8 hires (max 10 per type)
const dispCount=n=>n<=0?0:n<=6?n:Math.min(10,6+Math.floor((n-6)/8));
const colX=c=>SX+(c+.5)*B;
const MAX_SPRITES=36;
let shown=[]; // characters on screen per crew type; each one deals its share of that type's damage
function syncSprites(){
  const wants=WORKERS.map((w,i)=>dispCount(S.own[i]));
  let total=wants.reduce((a,b)=>a+b,0);
  for(let pass=0;total>MAX_SPRITES&&pass<12;pass++)for(let i=0;i<wants.length&&total>MAX_SPRITES;i++)if(wants[i]>2){wants[i]--;total--;}
  shown=wants;
  WORKERS.forEach((w,i)=>{
    const want=wants[i];let mine=sprites.filter(s=>s.i===i);
    while(mine.length>want){const s=mine.pop();sprites.splice(sprites.indexOf(s),1);}
    for(let k=mine.length;k<want;k++){
      const home=(i*2+k*3+1)%COLS;
      // pj: personal tempo so crew members never swing in lockstep
      sprites.push({i,k,home,off:((k%5)-2)*.15,x:colX(home),y:camY-B*(.5+Math.random()*.6),vy:0,t:Math.random()*w.period,pj:.85+Math.random()*.3,facing:k%2?-1:1,walk:0,sq:0,sv:0});
    }
  });
}
// every hire is visible: new characters drop in; once the crew is at its display cap, one of them drops in again
function hireDrop(i,n,before){
  // one falling character per hire (×10 drops ten), capped by how many are on screen
  const mine=sprites.filter(s=>s.i===i);if(!mine.length)return;
  const added=Math.max(0,mine.length-before),old=mine.slice(0,before).sort(()=>Math.random()-.5);
  const again=Math.min(n-added,old.length);
  for(let k=0;k<again;k++){const sp=old[k];sp.y=camY-B*(.6+(added+k)*.35);sp.vy=0;}
  const sp=mine[mine.length-1];
  floatText(clamp(sp.x,B*1.5,W-B*1.5),camY+B*.9,`+${n} ${WORKERS[i].name}`,'#7fe0a0',15,{max:1.3,vy:20});
}

function advance(){

function tapAt(px){

function workerHit(sp,ci){

function explode(pj){
  const row=S.row,al=aliveIdx();

  spawnParts(pj.tx,pj.ty,DENS?4:10,DENS?'rgba(90,80,75,.4)':'rgba(90,80,75,.8)',{kind:'smoke',speed:.6,g:-60,size:DENS?2:3,life:DENS?.6:1});

/* ================= UPDATE ================= */
function update(dt){
  time+=dt;DENS=density();
  goldAggT+=dt;if(goldAgg>0&&goldAggT>(DENS===2?1:.7)){floatText(SX+SW/2,(S.row.r+.1)*B,'+'+fmt(goldAgg),'#ffd84a',DENS===2?28:24,{coin:1,max:1.3,vy:45});goldAgg=0;goldAggT=0;}
  const camT=S.depth*B-frontY();
  if(regionFx.t>=0){
    // new region: camera starts high and glides down into the new layer
    regionFx.t+=dt;const k=Math.min(1,regionFx.t/1.4),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    camY=camT-B*3.5*(1-e);if(regionFx.t>1.9)regionFx.t=-1;
  }else camY=lerp(camY,camT,1-Math.pow(.0015,dt));
  shake*=Math.pow(.02,dt);
  combo.show=Math.max(0,combo.show-dt*.6);if(time-combo.last>1.2)combo.n=0;
  for(const c of S.row.cells) if(c){spring(c,dt);c.pop=Math.min(1,(c.pop||0)+dt*3.2);c.flash=(c.flash||0)*Math.pow(.0005,dt);}
  spring(player,dt);
  // player: snaps to the column of the last tap, then idles
  const pc=nearestAlive(player.col);if(pc>=0)player.col=pc;
  const ptx=colX(player.col);if(!player.x)player.x=ptx;
  const pdx=ptx-player.x;player.x+=clamp(pdx,-B*14*dt,B*14*dt);if(Math.abs(pdx)>2)player.facing=pdx>0?1:-1;
  player.st+=dt;
  for(const sp of sprites){
    const w=WORKERS[sp.i],ci=nearestAlive(sp.home);
    if(ci>=0){
      const tx=SX+(ci+.5+sp.off)*B,dx=tx-sp.x,v=B*3.2*dt;
      if(Math.abs(dx)>1){sp.x+=clamp(dx,-v,v);sp.facing=dx>0?1:-1;sp.walk+=dt*16;}else sp.walk=0;
    }
    const col=clamp(Math.floor((sp.x-SX)/B),0,COLS-1),ground=(S.row.cells[col]?S.row.r:S.row.r+1)*B;
    if(sp.y<ground-.5||sp.vy<0){sp.vy+=1800*dt;sp.y=Math.min(ground,sp.y+sp.vy*dt);if(sp.y>=ground){if(sp.vy>400){spawnParts(sp.x,ground,6,'rgba(220,190,160,.6)',{kind:'smoke',speed:.4,g:-30,size:2});}sp.sv-=Math.min(6,sp.vy/180);sp.vy=0;}}
    else if(sp.y>ground){sp.y=Math.max(ground,sp.y-B*4*dt);sp.vy=0;}
    spring(sp,dt);
    const per=w.period*sp.pj,p0=sp.t/per;sp.t+=dt;
    // mole: dives in one block and pops out of another
    if(w.draw==='mole'){const pn=sp.t/per;if(pn<.6)sp.moved=0;else if(pn>.76&&!sp.moved){const al=aliveIdx();if(al.length){const nc=al[Math.floor(Math.random()*al.length)];sp.home=nc;sp.x=SX+(nc+.5+sp.off)*B;}sp.moved=1;}}
    if(w.draw==='mole'&&p0<.6&&sp.t/per>=.6&&ci>=0&&S.row.cells[ci])spawnParts(sp.x,S.row.r*B,5,BLOCKS[hostFor(S.row.cells[ci].t,S.row.r)].base,{up:1,speed:.6,kind:'chunk',size:.7});
    if(sp.t>=per){sp.t-=per;if(ci>=0&&S.row.cells[ci])workerHit(sp,ci);}
  }
  for(let k=projs.length-1;k>=0;k--){const pj=projs[k];pj.t+=dt;if(pj.t>=pj.dur){projs.splice(k,1);explode(pj);}}
  for(let k=parts.length-1;k>=0;k--){const p=parts[k];p.life+=dt;if(p.life>=p.max){parts.splice(k,1);continue;}p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.3,dt);p.rot+=(p.vr||0)*dt;}
  for(let k=floats.length-1;k>=0;k--){const f=floats[k];f.life+=dt;f.y+=f.vy*dt;f.vy*=Math.pow(.25,dt);if(f.life>=f.max)floats.splice(k,1);}
  for(let k=swings.length-1;k>=0;k--){swings[k].t+=dt;if(swings[k].t>.25)swings.splice(k,1);}
  for(let k=flies.length-1;k>=0;k--){const f=flies[k];f.t+=dt;if(f.t>=f.dur){flies.splice(k,1);bumpHud();}}
  if(Math.random()<dt*4){const ci=Math.floor(Math.random()*COLS),c=S.row.cells[ci];if(c&&(BLOCKS[c.t].gem||BLOCKS[c.t].chest||BLOCKS[c.t].ore)){spawnParts(SX+(ci+.2+Math.random()*.6)*B,(S.row.r+.2+Math.random()*.6)*B,1,'#fff',{kind:'spark',speed:.05,g:0,life:.6});}}
  if(boostOn()&&Math.random()<dt*10) spawnParts(Math.random()*W,camY+Math.random()*H*.6,1,'#ffd84a',{kind:'spark',speed:.1,g:-40,life:1});
  S.last=now();
}

/* ================= RENDER ================= */
function crackLines(cell,ci){
  if(cell.cr) return cell.cr;
  const R=rng(strSeed('c'+S.row.r+'_'+ci)+S.seed),lines=[];
  for(let k=0;k<6;k++){let x=.5+(R()-.5)*.2,y=.5+(R()-.5)*.2,a=R()*Math.PI*2;const pts=[[x,y]];for(let j=0;j<4;j++){a+=(R()-.5)*1.2;x+=Math.cos(a)*.11;y+=Math.sin(a)*.11;pts.push([clamp(x,.06,.94),clamp(y,.06,.9)]);}lines.push(pts);}
  cell.cr=lines;return lines;
}

  g.fillStyle='#8fd481';g.beginPath();g.moveTo(-10,gy);for(let x=0;x<=W+10;x+=W/10)g.lineTo(x,gy-B*(.7+.35*Math.sin(x*.012+1)));g.lineTo(W+10,gy);g.fill();

function drawSprites(cy){

  openModal(`<h2>Tekrar hoş geldin!</h2><p>Sen yokken ekibin ${dur(t)} boyunca kazmaya devam etti${sec>cap?` (sınır ${dur(cap)})`:''}.</p>
    <div class="gain"><span class="coin"></span>+${fmt(v)}</div><p>Çevrimdışı verim %${Math.round(eff*100)}. Gece Vardiyası ve Uyumayan Maden bunu artırır.</p>
    <div class="acts"><button class="buy" data-act="ok">Topla</button></div>`,{__lock:1,ok:()=>{addGold(v);SFX.coin();closeModal();}});
}

/* ================= INPUT ================= */
cv.addEventListener('pointerdown',e=>{e.preventDefault();const r=cv.getBoundingClientRect();tapAt(e.clientX-r.left);});
listEl.addEventListener('click',e=>{
  const cb=e.target.closest('button[data-costume]');
  if(cb){if(!cb.disabled){S.costume=cb.dataset.costume;SFX.ui();colHTML='';renderPanel();}return;}
  const b=e.target.closest('button[data-k]');if(!b||b.disabled)return;
  const it=curItems.get(b.dataset.k);if(!it||!it.act)return;
  if(it.act()){SFX.buy();checkAch();}
  renderPanel();updateHud();
});
document.querySelector('.nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;SFX.ui();listEl.scrollTop=0;renderPanel();});
$('seg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.buyMult=b.dataset.mult==='max'?'max':+b.dataset.mult;SFX.ui();renderPanel();});
$('boost').addEventListener('click',()=>{const n=now();if(n<S.boostReady)return;S.boostEnd=n+45000;S.boostReady=n+45000+240000;S.stats.boosts++;banner('Altın Rüzgarı','45 sn ×2');SFX.region();updateHud();});
$('bSet').addEventListener('click',()=>openSettings(false));
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){save();}
  else{const away=(now()-S.last)/1000;if(away>5)grantAway(away,true);S.last=now();}
});
window.addEventListener('pagehide',save);

/* ================= BOOT ================= */
let lastT=0,uiAcc=0,saveAcc=0;
function frame(ts){
  const dt=Math.min(.1,lastT?(ts-lastT)/1000:0);lastT=ts;
  update(dt);render();
  uiAcc+=dt;saveAcc+=dt;
  if(uiAcc>.2){uiAcc=0;updateHud();renderPanel();checkAch();}
  if(saveAcc>5){saveAcc=0;save();}
  requestAnimationFrame(frame);
}
function start(data){
  S=(data&&data.state)?Object.assign(fresh(),data.state):(load()||fresh());
  while(S.own.length<WORKERS.length)S.own.push(0); // saves from before the deep crew existed
  while(S.tiers.length<WORKERS.length)S.tiers.push(0);
  S.stats=Object.assign({blocks:0,taps:0,crits:0,chests:0,goldAll:0,runs:0,bestDepth:0,meters:0,hires:0,boosts:0},S.stats);
  if(!S.hz)S.hz={};
  rollDay();updateCol();
  const away=(now()-S.last)/1000;
  if(!S.row||S.row.r!==S.depth||S.row.cells.length!==COLS)makeFront();
  resize();camY=S.depth*B-frontY();player.x=colX(player.col);
  syncSprites();sprites.forEach(s=>{s.y=S.row.r*B;});
  new ResizeObserver(()=>{resize();player.x=colX(player.col);}).observe(stage);
  window.claude?.hot?.snapshot?.(()=>({state:serial()}));
  updateHud();renderPanel();
  if(!(data&&data.state)&&away>5)grantAway(away,true);
  S.last=now();
  requestAnimationFrame(frame);
}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
