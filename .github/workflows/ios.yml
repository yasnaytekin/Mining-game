name: iOS

# Manual only: macOS runner minutes cost more. Builds an unsigned simulator app to prove the
# project compiles; App Store builds need an Apple Developer account and signing (see store/YAYIN.md).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build:web && npx cap sync ios
      - name: Simülatör derlemesi
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          cd build/Build/Products/Debug-iphonesimulator && zip -qr "$GITHUB_WORKSPACE/kazdikca-simulator.zip" App.app
      - uses: actions/upload-artifact@v4
        with:
          name: kazdikca-ios-simulator
          path: kazdikca-simulator.zip
